<meta charset="utf-8">
<title>おすそわけ収穫 愛媛版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: 左にデモの案内パネル、右にスマホ実寸のアプリ画面。狭い画面ではアプリ→案内の縦積み */
:root{
  --g:#13A35A; --g-d:#0C8547; --g-ink:#0A6B38; --g-50:#E7F6ED; --g-100:#CDEEDB; --on-g:#FFFFFF;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#13201A; --ink-2:#4B5C53; --ink-3:#85948B; --line:#E1E9E4;
  --stage:#E4ECE7; --frame:#0F1612; --guide:#F7FAF8;
  --warm:#E4572A; --warm-50:#FDEDE6; --amber:#F0A10E; --amber-50:#FFF4DA; --danger:#D23B3B; --danger-50:#FCE9E9;
  --sat:#2F6FD6; --sun:#D9453B;
  --qr-bg:#FFFFFF; --qr-fg:#0F1612; --cam:#18211C; --cam-ink:#E9F1EC;
  --map-bg:#EEF3E6; --map-field:#DDEBCB; --map-field2:#E9E3CC; --map-road:#FFFFFF; --map-water:#CFE3EE; --map-line:#C9D6C0;
  --ph-filter:none;
  --shadow:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.07);
  --f-round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g:#2BBF6C; --g-d:#23A65D; --g-ink:#7FE0A7; --g-50:#11281B; --g-100:#1A3C29; --on-g:#04200F;
  --bg:#0C120F; --card:#151E19; --ink:#E5EEE9; --ink-2:#A6B5AD; --ink-3:#6C7C73; --line:#24302A;
  --stage:#070B09; --frame:#000000; --guide:#101813;
  --warm:#FF7C52; --warm-50:#3A1C12; --amber:#F5B43A; --amber-50:#33280F; --danger:#FF6B6B; --danger-50:#3A1717;
  --sat:#7AA7F5; --sun:#FF7A70;
  --cam:#050806; --cam-ink:#E9F1EC;
  --map-bg:#18221B; --map-field:#1F2F22; --map-field2:#2A2A1F; --map-road:#34413A; --map-water:#1B2F3A; --map-line:#2A372F;
  --ph-filter:brightness(.82) saturate(.9);
  --shadow:0 1px 0 rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --g:#2BBF6C; --g-d:#23A65D; --g-ink:#7FE0A7; --g-50:#11281B; --g-100:#1A3C29; --on-g:#04200F;
  --bg:#0C120F; --card:#151E19; --ink:#E5EEE9; --ink-2:#A6B5AD; --ink-3:#6C7C73; --line:#24302A;
  --stage:#070B09; --frame:#000000; --guide:#101813;
  --warm:#FF7C52; --warm-50:#3A1C12; --amber:#F5B43A; --amber-50:#33280F; --danger:#FF6B6B; --danger-50:#3A1717;
  --sat:#7AA7F5; --sun:#FF7A70;
  --cam:#050806; --cam-ink:#E9F1EC;
  --map-bg:#18221B; --map-field:#1F2F22; --map-field2:#2A2A1F; --map-road:#34413A; --map-water:#1B2F3A; --map-line:#2A372F;
  --ph-filter:brightness(.82) saturate(.9);
  --shadow:0 1px 0 rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.num{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{min-height:100vh;display:flex;gap:56px;justify-content:center;align-items:flex-start;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide{width:330px;flex:none;position:sticky;top:32px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;border-radius:14px;background:var(--g);color:var(--on-g);display:grid;place-items:center}
.logo .ic{width:28px;height:28px}
.brand h1{font-family:var(--f-round);font-weight:800;font-size:22px;margin:0;line-height:1.2;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:12px}
.lead{margin:0;color:var(--ink-2);font-size:13px;line-height:1.75}
.gbox{background:var(--guide);border:1px solid var(--line);border-radius:16px;padding:14px}
.glabel{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px}
.modesw{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
.modesw button{border-radius:999px;padding:8px 0;text-align:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.modesw button.on{background:var(--g);color:var(--on-g)}
.jumps{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.jumps button{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--ink-2)}
.jumps button:hover{background:var(--bg);color:var(--ink)}
.jumps button.on{background:var(--g-50);color:var(--g-ink);font-weight:700}
.jumps .ic{width:16px;height:16px;opacity:.5}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--ink-2)}
.req b{color:var(--g-ink);font-family:var(--f-round);margin-right:4px}
.gnote{font-size:11px;color:var(--ink-3);margin:0}

/* ---------- phone ---------- */
.phone{width:394px;max-width:100%;flex:none;height:820px;border-radius:52px;background:var(--frame);padding:11px;box-shadow:0 30px 60px -20px rgba(10,30,20,.35)}
.screen{height:100%;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 32px;font-family:var(--f-round);font-weight:700;font-size:15px;background:var(--card)}
.sbar.dark{background:var(--cam);color:var(--cam-ink)}
.sbar svg{height:12px;width:auto}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px 18px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--ink-3);padding:4px 0;position:relative}
.tabbar button .ic{width:24px;height:24px}
.tabbar button.on{color:var(--g)}
.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--warm);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-round)}

/* ---------- headers ---------- */
.hd{background:var(--card);flex:none}
.hdrow{display:flex;align-items:center;gap:8px;padding:6px 12px 10px 16px}
.hdrow h2{flex:1;margin:0;font-family:var(--f-round);font-weight:800;font-size:18px}
.loc{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;flex:1}
.loc .ic{color:var(--g)}
.loc small{color:var(--ink-3);font-weight:500;font-size:12px}
.icbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink-2)}
.icbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--warm);border:2px solid var(--card)}
.bar-title{display:flex;align-items:center;gap:4px;padding:4px 12px 10px 6px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar-title h2{flex:1;margin:0;font-size:16px;font-weight:700;text-align:center;padding-right:40px}
.bar-title.has-right h2{padding-right:0}
.dates{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates{align-items:flex-start}
.date{flex:none;width:52px;border-radius:14px;padding:6px 0 9px;display:flex;flex-direction:column;align-items:center;gap:0;background:var(--bg);position:relative;white-space:nowrap;line-height:1.35}
.date small{font-size:10.5px;color:var(--ink-3);font-weight:700}
.date b{font-family:var(--f-round);font-size:19px;font-weight:800;line-height:1.25}
.date .dw{font-size:11px;font-weight:700;color:var(--ink-2)}
.date .dw.sat{color:var(--sat)} .date .dw.sun{color:var(--sun)}
.date i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--g)}
.date.on{background:var(--g);color:var(--on-g)}
.date.on small,.date.on .dw{color:var(--on-g)}
.date.on i{background:var(--on-g)}
.date.none b{color:var(--ink-3)}
.chips{display:flex;gap:6px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--card);display:flex;align-items:center;gap:4px}
.chip .ic{width:15px;height:15px}
.chip.on{border-color:var(--g);color:var(--g-ink);background:var(--g-50)}

/* ---------- list ---------- */
.pad{padding:14px 14px 24px;display:flex;flex-direction:column;gap:14px}
.listhd{display:flex;align-items:center;gap:8px}
.listhd b{font-size:15px}
.listhd span{color:var(--ink-3);font-size:12.5px;flex:1}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:4px 10px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.seg button .ic{width:14px;height:14px}
.seg button.on{background:var(--ink);color:var(--card)}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:block;width:100%;text-align:left}
.ph{position:relative;filter:var(--ph-filter)}
.ph-soil{background:linear-gradient(170deg,#F8ECD3 0%,#E9D2A8 100%)}
.ph-house{background:linear-gradient(170deg,#EDF7E4 0%,#CDE8BF 100%)}
.ph-orchard{background:linear-gradient(170deg,#FFF1DB 0%,#F4D6AA 100%)}
.card .ph{height:132px}
.art{display:block;width:100%;height:100%}
.ph .left{position:absolute;left:10px;bottom:10px;background:rgba(15,22,18,.78);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px}
.ph .urgent{position:absolute;left:10px;top:10px;background:var(--warm);color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 9px;letter-spacing:.05em}
.favb{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#7A8A80}
.favb .ic{width:19px;height:19px}
.favb.on{color:#E2453B}
.favb.on .ic{fill:currentColor}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ctime{display:flex;align-items:baseline;gap:4px;font-family:var(--f-round);font-weight:700;color:var(--ink-2)}
.ctime b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.ctime .cdur{margin-left:auto;font-size:12px;background:var(--bg);border-radius:6px;padding:1px 8px;font-family:var(--f-body)}
.card h3{margin:0;font-size:15.5px;line-height:1.45}
.cfarm{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.rate{display:inline-flex;align-items:center;gap:2px;color:var(--ink);font-weight:700}
.star{width:14px;height:14px;color:var(--amber)}
.gift{display:flex;gap:10px;align-items:center;background:var(--g-50);border-radius:12px;padding:8px 10px;margin-top:2px}
.gift .ic{color:var(--g);width:22px;height:22px}
.gift small{display:block;font-size:10.5px;color:var(--g-ink);font-weight:700;letter-spacing:.04em}
.gift b{display:block;font-size:14px;line-height:1.4}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.cmeta .ic{width:14px;height:14px}
.cmeta>span:first-child{display:inline-flex;align-items:center;gap:2px}
.lvl{border-radius:6px;padding:1px 7px;font-weight:700;font-size:11.5px}
.lvl1{background:var(--g-50);color:var(--g-ink)}
.lvl2{background:var(--amber-50);color:var(--ink)}
.lvl3{background:var(--warm-50);color:var(--warm)}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:11.5px;color:var(--ink-2);background:var(--card)}
.ad{display:flex;gap:12px;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px;position:relative}
.ad .pr{position:absolute;top:8px;right:10px;font-size:10px;font-weight:800;color:var(--ink-3);border:1px solid var(--ink-3);border-radius:4px;padding:0 4px;line-height:1.5}
.ad .adart{width:64px;height:64px;border-radius:10px;overflow:hidden;flex:none}
.ad b{display:block;font-size:13px;line-height:1.45;padding-right:28px}
.ad small{color:var(--ink-3);font-size:11px}
.empty{text-align:center;color:var(--ink-3);padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:40px;height:40px;opacity:.5}

/* map */
.mapbox{border-radius:18px;overflow:hidden;background:var(--map-bg);border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.mrow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;box-shadow:var(--shadow);width:100%;text-align:left}
.mrow .ph{width:70px;height:70px;border-radius:10px;overflow:hidden;flex:none}
.mrow b{font-size:13.5px;display:block;line-height:1.4}
.mrow small{display:block;color:var(--ink-2);font-size:12px}
.mrow .mt{font-family:var(--f-round);font-weight:800;font-size:15px}
.pinno{font-family:var(--f-round);font-weight:800}

/* ---------- detail ---------- */
.hero{height:220px}
.round{position:absolute;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;color:#13201A;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.round.back{left:12px}
.round.fav2{right:12px;color:#7A8A80}
.round.fav2.on{color:#E2453B}
.round.fav2.on .ic{fill:currentColor}
.dsec{background:var(--card);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.dsec+.dsec,.farmrow+.dsec{margin-top:8px}
.dsec h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.dsec h2 small{font-size:11.5px;color:var(--ink-3);font-weight:500}
.dday{font-weight:700;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.dtime{font-family:var(--f-round);font-weight:800;font-size:30px;line-height:1.1;display:flex;align-items:baseline;gap:4px;letter-spacing:.01em}
.dtime span{font-size:20px;color:var(--ink-3)}
.dtime small{font-size:13px;color:var(--ink-2);font-weight:700;margin-left:6px;font-family:var(--f-body)}
.dtitle{margin:0;font-size:19px;line-height:1.45;text-wrap:balance}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.slots{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.slots b{color:var(--warm)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--ink-2)}
.pill.g{background:var(--g-50);color:var(--g-ink)}
.pill.warm{background:var(--warm);color:#fff}
.pill.amber{background:var(--amber-50);color:var(--ink)}
.pill.line{background:none;border:1.5px solid var(--g);color:var(--g-ink)}
.pill.gray{background:var(--bg);color:var(--ink-3)}
.pill.red{background:var(--danger-50);color:var(--danger)}
.pill .ic{width:13px;height:13px}
.farmrow{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 16px;margin-top:8px;width:100%}
.farmrow>span:nth-child(2){flex:1}
.farmrow b{display:block}
.farmrow small{display:block;color:var(--ink-2);font-size:12px}
.farmrow .ic{color:var(--ink-3)}
.av{width:44px;height:44px;border-radius:14px;background:var(--g-100);color:var(--g-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-round);font-size:18px;flex:none}
.av.sm{width:36px;height:36px;border-radius:50%;font-size:14px}
.av.warm{background:var(--warm-50);color:var(--warm)}
.av.amber{background:var(--amber-50);color:var(--ink)}
.giftbox{border:2px solid var(--g-100);border-radius:16px;overflow:hidden}
.giftbox .ph{height:120px}
.gitems{list-style:none;margin:0;padding:10px 14px 4px;display:flex;flex-direction:column;gap:4px}
.gitems li{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding:4px 0}
.gitems li:last-child{border:0}
.gitems b{font-family:var(--f-round);font-size:16px}
.fresh{display:flex;gap:6px;flex-wrap:wrap;padding:4px 14px 0}
.giftbox p{margin:0;padding:8px 14px 14px;font-size:13px;color:var(--ink-2)}
.fine{margin:0;font-size:12px;color:var(--ink-3);line-height:1.65}
.ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.ol li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.ol li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--g-50);color:var(--g-ink);font-weight:800;font-size:12px;display:grid;place-items:center;font-family:var(--f-round);margin-top:1px}
.meter{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px}
.meter .segs{display:flex;gap:3px}
.meter .segs i{width:22px;height:8px;border-radius:3px;background:var(--line)}
.meter .segs i.f{background:var(--g)}
.meter b{font-size:13.5px}
.meter small{color:var(--ink-2);font-size:12px;flex:1}
.blist{display:flex;flex-wrap:wrap;gap:6px}
.blist span{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px}
.minimap{border-radius:12px;overflow:hidden;height:120px;background:var(--map-bg)}
.minimap>svg{width:100%;height:100%;display:block}
.addr b{display:block;font-size:14px}
.addr small{color:var(--ink-2);font-size:12.5px}
.facil{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.facil div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--ink-2)}
.facil b{display:block;font-size:15px;color:var(--g-ink)}
.facil .no b{color:var(--ink-3)}
.ul{margin:0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ul li{display:flex;gap:8px}
.ul li .ic{width:16px;height:16px;color:var(--g);margin-top:3px}
.ins{flex-direction:row;align-items:flex-start;gap:12px}
.ins>.ic{width:32px;height:32px;color:var(--g);flex:none}
.ins b{display:block;font-size:14px}
.ins p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}

/* ---------- cta / buttons ---------- */
.cta{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 14px 22px;display:flex;gap:10px;align-items:center}
.cta .dl{flex:none;display:flex;flex-direction:column;line-height:1.3}
.cta .dl small{font-size:11px;color:var(--ink-3)}
.cta .dl b{font-size:13.5px;font-family:var(--f-round)}
.btn{flex:1;height:52px;border-radius:14px;background:var(--g);color:var(--on-g);font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.02em;font-family:var(--f-round)}
.btn:hover{background:var(--g-d)}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.dangerline{background:var(--card);color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{height:40px;font-size:13.5px;border-radius:11px}
.btn.narrow{flex:none;padding:0 18px}
.btn .ic{width:18px;height:18px}
.linkbtn{color:var(--ink-3);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.row2{display:flex;gap:8px}

/* ---------- apply ---------- */
.sumrow{display:flex;gap:12px;align-items:center;background:var(--card);padding:12px 16px;border-bottom:1px solid var(--line)}
.sumrow .ph{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none}
.sumrow b{display:block;font-size:14px;line-height:1.4}
.sumrow small{color:var(--ink-2);font-size:12px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--card)}
.chk input{appearance:none;flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;margin:1px 0 0;cursor:pointer;background:var(--card)}
.chk input:checked{background:var(--g);border-color:var(--g)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-g);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:has(input:checked){border-color:var(--g);background:var(--g-50)}
.chk b{display:block;font-size:14px}
.chk small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.55}
.stack{display:flex;flex-direction:column;gap:8px}
.h3{margin:6px 0 0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.h3 .ic{width:18px;height:18px;color:var(--g)}
.infobox{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;border:1px solid var(--line)}
.infobox span{color:var(--ink-2)}

/* ---------- result screens ---------- */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px 8px}
.bigcheck{width:76px;height:76px;border-radius:50%;background:var(--g);color:var(--on-g);display:grid;place-items:center}
.bigcheck .ic{width:40px;height:40px;stroke-width:3}
.done h1{margin:4px 0 0;font-family:var(--f-round);font-weight:800;font-size:22px}
.done p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:300px}
.tl{list-style:none;margin:0;padding:16px;background:var(--card);border-radius:16px;display:flex;flex-direction:column;gap:0}
.tl li{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;z-index:1}
.tl i .ic{width:14px;height:14px;stroke-width:3}
.tl li.ok i{background:var(--g);border-color:var(--g);color:var(--on-g)}
.tl li.now i{border-color:var(--g)}
.tl b{display:block;font-size:13.5px}
.tl small{color:var(--ink-2);font-size:12px}

/* ---------- schedule ---------- */
.cal{background:var(--card);border-radius:16px;padding:12px}
.calhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhd b{font-family:var(--f-round);font-size:15px}
.calhd small{color:var(--ink-3);font-size:11px;display:flex;gap:10px}
.calhd small i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg .w{font-size:10.5px;color:var(--ink-3);font-weight:700;padding-bottom:2px}
.calg .w.sat{color:var(--sat)} .calg .w.sun{color:var(--sun)}
.calg .d{height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:3px;font-family:var(--f-round);font-weight:700;font-size:14px}
.calg .d.today{background:var(--ink);color:var(--card)}
.calg .d.past{color:var(--ink-3)}
.calg .d i{width:7px;height:7px;border-radius:50%}
.m-ok{background:var(--g)} .m-wait{background:none;border:2px solid var(--g)} .m-done{background:var(--ink-3)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--line)}
.tabs3 button{padding:8px 0;border-radius:9px;text-align:center;font-weight:700;font-size:13px;color:var(--ink-3)}
.tabs3 button.on{background:var(--g-50);color:var(--g-ink)}
.tabs3 button em{font-style:normal;font-family:var(--f-round);margin-left:4px}
.plan{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.plan .ptop{display:flex;gap:12px;padding:14px;align-items:flex-start}
.plan .ph{width:72px;height:72px;border-radius:12px;overflow:hidden;flex:none}
.plan .when{font-family:var(--f-round);font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.plan b.t{display:block;font-size:14.5px;line-height:1.4;margin-top:2px}
.plan small{display:block;color:var(--ink-2);font-size:12px}
.plan .pact{display:flex;gap:8px;padding:0 14px 14px}
.plan .pfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.plan .pfoot button{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink-2)}
.plan .pfoot .ic{width:16px;height:16px}

/* ---------- check-in ---------- */
.cam{background:var(--cam);color:var(--cam-ink);padding:24px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.camf{width:230px;height:230px;position:relative;border-radius:18px;display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.04)}
.camf .qr{width:150px;height:150px;opacity:.55;transform:rotate(-4deg)}
.camf .c{position:absolute;width:42px;height:42px;border:4px solid var(--g)}
.camf .c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.camf .c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.camf .c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.camf .c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.scanline{position:absolute;left:14px;right:14px;height:3px;background:var(--g);box-shadow:0 0 12px var(--g);top:20%;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:80%}}
.cam p{margin:0;font-size:13.5px;opacity:.9}
.cam h2{margin:0;font-size:17px}
.geo{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;border:1.5px solid var(--g-100)}
.geo .ic{color:var(--g);width:24px;height:24px}
.geo b{display:block;font-size:13.5px}
.geo small{display:block;color:var(--ink-2);font-size:12px}
.insur{background:var(--g);color:var(--on-g);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px}
.insur .lb{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.insur .lb i{width:8px;height:8px;border-radius:50%;background:var(--on-g);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.insur .tm{font-family:var(--f-round);font-weight:800;font-size:36px;letter-spacing:.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.insur small{font-size:12px;opacity:.9}
.kv{background:var(--card);border-radius:16px;padding:4px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv div:last-child{border:0}
.kv span{color:var(--ink-2);flex:none}
.kv b{text-align:right}

/* ---------- review ---------- */
.recv{background:var(--card);border-radius:16px;overflow:hidden}
.recv .ph{height:110px}
.recv .gitems{padding-top:12px}
.recvb{margin:4px 14px 14px;width:calc(100% - 28px)}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{color:var(--line)}
.stars button.on{color:var(--amber)}
.stars svg{width:38px;height:38px}
.ttags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
textarea.ta,input.in,select.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:14px;resize:none}
textarea.ta:focus,input.in:focus,select.in:focus{outline:none;border-color:var(--g)}
.panel{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:14.5px;text-align:center}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-round);font-weight:800;font-size:22px;line-height:1.2}
.stat b small{font-size:12px;margin-left:1px}
.stat span{font-size:11.5px;color:var(--ink-2)}

/* ---------- messages ---------- */
.thread{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);width:100%;text-align:left}
.thread>div{flex:1;min-width:0}
.thread b{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.thread b time{font-weight:500;color:var(--ink-3);font-size:11.5px;flex:none}
.thread p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .unread{background:var(--g);color:var(--on-g);border-radius:10px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;font-family:var(--f-round);padding:0 6px}
.notice{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-2);background:var(--amber-50);padding:10px 14px}
.notice .ic{width:16px;height:16px;color:var(--amber);margin-top:2px}
.msgs{padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg .bub{background:var(--card);border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:13.5px;line-height:1.55}
.msg time{font-size:10.5px;color:var(--ink-3);flex:none}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--g);color:var(--on-g);border-radius:16px 16px 4px 16px}
.msg .who{font-size:11px;color:var(--ink-3);display:block;margin-bottom:2px}
.sys{align-self:center;font-size:11.5px;color:var(--ink-3);background:var(--card);border-radius:999px;padding:3px 12px}
.composer{flex:none;display:flex;gap:8px;padding:8px 12px 22px;background:var(--card);border-top:1px solid var(--line)}
.composer input{flex:1;border:0;background:var(--bg);border-radius:999px;padding:10px 16px;font-size:14px}
.composer input:focus{outline:2px solid var(--g)}
.composer button{flex:none;align-self:center;width:44px;height:44px;aspect-ratio:1;padding:0;border-radius:50%;background:var(--g);color:var(--on-g);display:grid;place-items:center}
.composer input{min-width:0}

/* ---------- my page ---------- */
.me-hd{background:var(--card);padding:6px 16px 18px;display:flex;gap:14px;align-items:center}
.me-hd .av{width:60px;height:60px;border-radius:50%;font-size:24px}
.me-hd b{font-size:18px;display:block}
.me-hd small{color:var(--ink-2);font-size:12px;display:flex;gap:6px;align-items:center}
.vegcard{background:var(--g);color:var(--on-g);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;position:relative}
.vegcard .lb{font-size:12.5px;font-weight:700;opacity:.92}
.vegcard .kg{font-family:var(--f-round);font-weight:800;font-size:40px;line-height:1}
.vegcard .kg small{font-size:18px;margin-left:2px}
.vegcard .yen{font-size:13px;font-weight:700}
.vegcard .yen span{opacity:.85;font-weight:500;font-size:11.5px}
.vbars{display:flex;gap:10px;align-items:flex-end;height:64px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;height:100%;justify-content:flex-end}
.vbars i{width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--on-g);opacity:.35}
.vbars div:last-child i{opacity:1}
.vegcard .art{position:absolute;right:-6px;top:6px;width:120px;height:80px;opacity:.95}
.menu{background:var(--card);border-radius:16px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;padding:14px;width:100%;border-bottom:1px solid var(--line);font-size:14px}
.menu button:last-child{border:0}
.menu button>span{flex:1}
.menu button .ic:first-child{color:var(--g)}
.menu button .ic:last-child{color:var(--ink-3);width:16px;height:16px}
.menu button em{font-style:normal;font-size:12px;color:var(--ink-3)}
.favs{display:flex;gap:14px;overflow-x:auto;padding:2px}
.favs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;width:64px;flex:none;text-align:center;color:var(--ink-2)}
.favs .av{width:52px;height:52px;border-radius:50%}
.sechd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-4px}
.sechd b{font-size:15px}
.sechd small{color:var(--ink-3);font-size:12px}
.hist{background:var(--card);border-radius:16px;padding:2px 14px}
.hist div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist div:last-child{border:0}
.hist time{font-family:var(--f-round);font-weight:700;color:var(--ink-3);width:40px;flex:none}
.hist span{flex:1}
.hist b{font-family:var(--f-round)}
.sos{background:var(--danger-50);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sos b{color:var(--danger);font-size:15px}
.sos p{margin:0;font-size:13px;color:var(--ink-2)}
.tel{font-family:var(--f-round);font-weight:800;font-size:22px;user-select:all}

/* ---------- farmer ---------- */
.fhd{display:flex;gap:12px;align-items:center;padding:6px 14px 14px 16px;background:var(--card)}
.fhd>div{flex:1}
.fhd b{display:block;font-size:17px;font-family:var(--f-round);font-weight:800}
.fhd small{display:flex;align-items:center;gap:4px;color:var(--g-ink);font-size:12px;font-weight:700}
.fhd small .ic{width:14px;height:14px}
.swap{font-size:11.5px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink-2);display:flex;gap:4px;align-items:center}
.swap .ic{width:14px;height:14px}
.alert{background:var(--amber-50);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--amber)}
.alert .ah{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.alert .ah .ic{color:var(--amber);width:22px;height:22px}
.alert p{margin:0;font-size:12.5px;color:var(--ink-2)}
.todo{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.todo .th{display:flex;justify-content:space-between;align-items:center}
.todo .th b{font-size:15px;display:flex;align-items:center;gap:8px}
.todo .th em{font-style:normal;background:var(--warm);color:#fff;border-radius:999px;font-family:var(--f-round);font-size:13px;padding:0 9px}
.todo .ap{display:flex;gap:-6px}
.todo .ap .av{margin-right:-8px;border:2px solid var(--card)}
.todo small{color:var(--ink-2);font-size:12px}
.prow{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.prow .pt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.prow .pt b{font-size:14.5px;line-height:1.4}
.prow .pd{font-family:var(--f-round);font-weight:700;font-size:13px;color:var(--ink-2)}
.prow .pf{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
.prow .pf .bar{max-width:140px}
.prow .pb{display:flex;gap:8px;justify-content:flex-end}
.minibtn{font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:9px;padding:4px 10px;display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);background:var(--card)}
.minibtn .ic{width:14px;height:14px}
.applicant{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.applicant .ah{display:flex;gap:12px;align-items:center}
.applicant .ah>div{flex:1}
.applicant .ah b{font-size:15px}
.applicant .ah small{display:flex;gap:8px;color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.applicant blockquote{margin:0;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.applicant .for{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between}
.applicant .for b{color:var(--danger);font-weight:700}
.toggle{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px}
.toggle>div{flex:1}
.toggle b{display:block;font-size:13.5px}
.toggle small{display:block;color:var(--ink-2);font-size:12px}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--g)}
.sw.on::after{left:23px}
.qrcard{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.qrcard .qr{width:190px;height:190px;border-radius:8px}
.qrcard b{font-size:15px}
.qrcard small{color:var(--ink-2);font-size:12px}
.arrive{background:var(--card);border-radius:16px;padding:4px 14px}
.arrive>div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arrive>div:last-child{border:0}
.arrive>div>span:nth-child(2){flex:1;font-size:14px;font-weight:700}
.arrive small{font-size:12px;color:var(--ink-3);font-weight:500;display:block}
.prog{display:flex;align-items:baseline;gap:6px}
.prog b{font-family:var(--f-round);font-size:28px;font-weight:800}
.prog span{color:var(--ink-2);font-size:13px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:0 14px 12px;background:var(--card)}
.steps span{white-space:nowrap;font-size:10px;color:var(--ink-3);text-align:center;border-top:4px solid var(--line);padding-top:5px;font-weight:700;line-height:1.3}
.steps span.done{border-color:var(--g-100);color:var(--g-ink)}
.steps span.on{border-color:var(--g);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.fl{font-size:13px;font-weight:700}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.f2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:max-content;background:var(--card)}
.stepper button{width:46px;height:44px;font-size:20px;font-weight:700;color:var(--g-ink);text-align:center}
.stepper b{width:60px;text-align:center;font-family:var(--f-round);font-size:18px}
.warn{display:flex;gap:8px;align-items:flex-start;background:var(--danger-50);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700}
.warn .ic{width:16px;height:16px;margin-top:2px}
.okmsg{display:flex;gap:8px;align-items:center;color:var(--g-ink);font-size:12.5px;font-weight:700}
.okmsg .ic{width:16px;height:16px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.levels button{border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--card)}
.levels button b{display:block;font-size:13.5px}
.levels button small{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.4}
.levels button.on{border-color:var(--g);background:var(--g-50)}
.ban{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ban ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.itemrow{display:grid;grid-template-columns:1fr 104px;gap:8px}
.photos{display:flex;gap:8px}
.photos>div{width:84px;height:84px;border-radius:12px;overflow:hidden;flex:none}
.photos .add{border:2px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:11px;text-align:center}
.photos .add .ic{margin:0 auto}
.btoggles{display:flex;flex-wrap:wrap;gap:6px}
.preview .card{cursor:default}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;cursor:pointer}
.radios input{accent-color:var(--g);width:18px;height:18px;margin:0}
.radios label:has(input:checked){border-color:var(--g);background:var(--g-50)}
.pen{width:100%;border-collapse:collapse;font-size:12.5px}
.pen td{padding:6px 8px;border-bottom:1px solid var(--line)}
.pen td:last-child{text-align:right;font-weight:700;font-family:var(--f-round)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- sheet / toast ---------- */
.sheet-bg{position:absolute;inset:0;background:rgba(8,16,12,.45);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px 26px;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:17px;font-family:var(--f-round);font-weight:800}
.sheet p{margin:0;font-size:13px;color:var(--ink-2)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:30;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
.toast .ic{color:var(--g);width:18px;height:18px}

/* ---------- 参加時間シークバー ---------- */
.rlab{white-space:nowrap;flex:none;font-size:11px;font-weight:800;background:var(--g);color:var(--on-g);border-radius:6px;padding:1px 6px;align-self:center;font-family:var(--f-body);letter-spacing:.05em}
.dtime .rlab{font-size:12px;padding:2px 8px;margin-right:4px;color:var(--on-g)}
.seek{display:flex;flex-direction:column;gap:12px;border:2px solid var(--g-100);border-radius:16px;padding:14px}
.seekhd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.seekhd small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.seekhd b{font-family:var(--f-round);font-weight:800;font-size:24px;line-height:1.2;color:var(--g-ink);font-variant-numeric:tabular-nums}
.seekhd .tr{text-align:right}
.seekhd .tr b{color:var(--ink);font-size:20px}
.crate{position:relative;background:var(--g-50);border-radius:14px 14px 10px 10px;padding:10px 10px 0;overflow:hidden}
.basket{height:112px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;padding:0 6px}
.vg{width:42px;height:42px;margin:0 -4px -10px;transform:rotate(var(--r));transition:opacity .2s,transform .2s}
.vg svg{width:100%;height:100%;display:block}
.vg.pop{animation:drop .55s cubic-bezier(.3,1.5,.5,1) backwards}
.vg.out{opacity:0;transform:translateY(-14px) rotate(var(--r)) scale(.6)}
@keyframes drop{from{opacity:0;transform:translateY(-100px) rotate(calc(var(--r) * -3)) scale(.7)}to{opacity:1;transform:rotate(var(--r))}}
.crate-front{position:relative;z-index:1;height:30px;margin:0 -10px;background:repeating-linear-gradient(180deg,#C48B4E 0 13px,#A9733C 13px 15px);color:#FFF6E8;font-family:var(--f-round);font-weight:800;font-size:12px;letter-spacing:.3em;display:grid;place-items:center}
.seek .gitems{padding:0}
button.crate{display:block;width:100%;cursor:pointer;text-align:center}
.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--a:calc(14px + (100% - 28px) * var(--mn));--b:calc(14px + (100% - 28px) * var(--vl))}
.rng::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,transparent var(--a),var(--g) var(--a) var(--b),transparent var(--b)),repeating-linear-gradient(-45deg,var(--ink-3) 0 2px,transparent 2px 6px) 0 0/var(--a) 100% no-repeat,var(--line)}
.rng::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,transparent var(--a),var(--g) var(--a) var(--b),transparent var(--b)),repeating-linear-gradient(-45deg,var(--ink-3) 0 2px,transparent 2px 6px) 0 0/var(--a) 100% no-repeat,var(--line)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:var(--card);border:6px solid var(--g);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rng::-moz-range-thumb{box-sizing:border-box;width:28px;height:28px;border-radius:50%;background:var(--card);border:6px solid var(--g);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rng:disabled{cursor:not-allowed;opacity:.65}
.ticks{position:relative;height:18px;font-size:11px;color:var(--ink-3);font-family:var(--f-round);font-weight:700}
.ticks span{position:absolute;top:0;transform:translateX(-50%);left:calc(14px + (100% - 28px) * var(--p));white-space:nowrap}
.ticks span.mn{color:var(--g-ink)}
.minnote{margin:0;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.minnote .ic{width:15px;height:15px;color:var(--amber)}
.minnote.flash{animation:flash .6s}
@keyframes flash{0%,100%{transform:none}20%,60%{transform:translateX(-4px);color:var(--danger)}40%,80%{transform:translateX(4px);color:var(--danger)}}
.vnote{margin:0;font-size:13px;color:var(--ink-2)}
.infobox b{text-align:right}
.infobox{gap:12px}
.infobox>span{flex:none;white-space:nowrap}
.itemrow.three{grid-template-columns:1fr 72px 72px}
.ipv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--g-50);border-radius:12px;padding:10px 12px;font-size:12.5px}
.ipv span{color:var(--g-ink);font-weight:700}

/* ---------- 農場ページ・口コミ ---------- */
.fhero{height:180px}
.fname{margin:0;font-size:21px;font-family:var(--f-round);font-weight:800;line-height:1.3;text-wrap:balance}
.kana{font-size:12px;color:var(--ink-3);margin-top:-8px}
.rrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--ink-2)}
.rrow b{font-family:var(--f-round);font-size:16px;color:var(--ink)}
.stars-s{display:inline-flex;gap:1px}
.stars-s .star{width:15px;height:15px}
.star.off{color:var(--line)}
.intro{margin:0;font-size:13.5px;line-height:1.85}
.spec{margin:0;display:grid;grid-template-columns:112px minmax(0,1fr);border-top:1px solid var(--line)}
.spec dt,.spec dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.spec dt{color:var(--ink-3);font-weight:700;font-size:12px;padding-right:8px}
.spec dd small{display:block;color:var(--ink-3);font-size:11.5px}
.acc{display:flex;flex-direction:column;gap:10px}
.acc>div{display:flex;gap:10px;font-size:13px}
.acc .ic{color:var(--g);width:18px;height:18px;margin-top:2px}
.acc b{display:block;font-size:11.5px;color:var(--ink-3)}
.rsum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.rbig{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.rbig b{font-family:var(--f-round);font-weight:800;font-size:40px;line-height:1}
.rbig small{font-size:11px;color:var(--ink-3)}
.dist{display:flex;flex-direction:column;gap:4px}
.dist>div{display:grid;grid-template-columns:24px 1fr 32px;gap:6px;align-items:center;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dist i{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;display:block}
.dist i span{display:block;height:100%;background:var(--amber);border-radius:3px}
.review{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.review .rh{display:flex;gap:10px;align-items:center}
.review .rh>div{flex:1;min-width:0}
.review .rh b{font-size:13.5px}
.review .rh small{display:block;font-size:11.5px;color:var(--ink-3)}
.review p{margin:0;font-size:13px;line-height:1.75}
.review .rt{display:flex;flex-wrap:wrap;gap:4px}
.review .help{align-self:flex-start;font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.review .help.on{color:var(--g-ink);border-color:var(--g);background:var(--g-50)}
.favs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;width:76px;flex:none;text-align:center;color:var(--ink-2)}

/* ---------- グループ・子連れ ---------- */
.kidrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kidrow>div{border-radius:12px;padding:10px 8px;background:var(--g-50);display:flex;flex-direction:column;gap:2px}
.kidrow>div.ng{background:var(--danger-50)}
.kidrow b{display:flex;align-items:center;gap:3px;font-size:12.5px;color:var(--g-ink)}
.kidrow .ng b{color:var(--danger)}
.kidrow .ic{width:14px;height:14px;flex:none}
.kidrow small{font-size:11px;color:var(--ink-2);line-height:1.45}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{border:2px solid var(--line);border-radius:16px;padding:14px 10px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ch .ic{width:28px;height:28px;color:var(--ink-3)}
.ch b{font-size:14px}
.ch small{font-size:11.5px;color:var(--ink-3)}
.ch.on{border-color:var(--g);background:var(--g-50)}
.ch.on .ic{color:var(--g)}
.ppbox{background:var(--card);border-radius:16px;padding:4px 14px}
.pp{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.pp:last-child{border:0}
.pp>div:first-child{flex:1;min-width:0}
.pp b{display:block;font-size:14px}
.pp small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.pp.ng b{color:var(--ink-3)}
.adrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:6px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.stepper.sm button{width:38px;height:38px;font-size:18px}
.stepper.sm b{width:34px;font-size:16px}
.stepper button:disabled{color:var(--line);cursor:not-allowed}
.ptotal{display:flex;justify-content:space-between;align-items:flex-end;background:var(--g);color:var(--on-g);border-radius:16px;padding:12px 16px}
.ptotal small{display:block;font-size:11.5px;opacity:.9}
.ptotal b{font-family:var(--f-round);font-weight:800;font-size:26px;line-height:1.2}
.ptotal .tr{text-align:right}
.grp{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--g-ink);background:var(--g-50);border-radius:10px;padding:6px 10px}
.grp .ic{width:16px;height:16px;flex:none}
.tag.camp{display:inline-flex;align-items:center;gap:2px;border-color:#F4CE55;background:#FFF6D6;color:#7A5200;font-weight:700}
.tag.camp .ic{width:12px;height:12px}
.tag.kid{border-color:var(--g-100);color:var(--g-ink);background:var(--g-50)}

/* ---------- アカウント連携 ---------- */
.myid{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px}
.myid small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.myid b{font-family:var(--f-round);font-size:18px;user-select:all}
.mem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.mem>span:nth-child(2){flex:1;min-width:0}
.mem b{display:block;font-size:13.5px}
.mem b small,.mrow2 b small{font-weight:500;color:var(--ink-3);font-size:11.5px}
.mem>span>small{display:block;font-size:11.5px;color:var(--ink-2)}
.mem.on{border-color:var(--g);background:var(--g-50)}
.mem:disabled{opacity:.6;cursor:not-allowed}
.mem .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-g)}
.mem.on .ck{background:var(--g);border-color:var(--g)}
.mem .ck .ic{width:14px;height:14px;stroke-width:3}
.memlist{background:var(--card);border-radius:16px;overflow:hidden}
/* 縦並びの枠の中ではボタンの高さを保つ */
.pad>.btn,.dsec>.btn,.ucard>.btn,.sos>.btn,.recv>.btn,.panel>.btn{flex:none}
.mrow2{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mrow2 .pill,.mrow2 .minibtn{flex:none;white-space:nowrap}
.mrow2:last-child{border:0}
.mrow2>div{flex:1;min-width:0}
.mrow2 b{display:block;font-size:13.5px}
.mrow2>div>small{display:block;font-size:11.5px;color:var(--ink-2)}
.ucard{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--line)}
.ucard .uh{display:flex;align-items:center;gap:12px}
.ucard .uh>div{flex:1;min-width:0}
.ucard .uh b{display:block;font-size:16px}
.ucard .uh small{color:var(--ink-3);font-size:12px}
.ucard .stat{background:var(--bg)}
.ucard p{margin:0;font-size:13px;color:var(--ink-2)}
.idin{display:flex;align-items:center;gap:6px}
.idin span{font-family:var(--f-round);font-weight:800;font-size:18px;color:var(--ink-3)}
.codein{font-family:var(--f-round);font-size:26px !important;letter-spacing:.5em;text-align:center}
.codebox{background:var(--g-50);border:2px dashed var(--g);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:4px}
.codebox b{font-family:var(--f-round);font-weight:800;font-size:40px;letter-spacing:.3em;color:var(--g-ink);user-select:all}
.codebox small{font-size:12px;color:var(--ink-2)}
.safe li .ic{color:var(--g)}
.grpbox{display:flex;flex-direction:column;gap:6px}
.gm{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px 10px}
.gm>div{flex:1;min-width:0}
.gm b{display:block;font-size:13px}
.gm small{display:block;font-size:11.5px;color:var(--ink-2)}
.gm .star{width:12px;height:12px;vertical-align:-1px}
.tabs2{grid-template-columns:1fr 1fr}

/* ---------- モーション：芽が出るように下から伸び、実が落ちるように弾む ---------- */
:root{--spring:cubic-bezier(.3,1.45,.5,1);--soft:cubic-bezier(.2,.8,.2,1)}
.view.in-fwd{animation:inFwd .32s var(--soft)}
.view.in-back{animation:inBack .32s var(--soft)}
.view.in-tab{animation:inTab .3s ease-out}
@keyframes inFwd{from{transform:translateX(30px);opacity:.25}}
@keyframes inBack{from{transform:translateX(-30px);opacity:.25}}
@keyframes inTab{from{transform:translateY(10px);opacity:0}}
.enter :is(.card,.ad,.mrow,.plan,.prow,.applicant,.todo,.thread,.dsec,.statrow>.stat,.review,.hist>div,.menu>button,.memlist>.mrow2,.mem,.chk,.infobox,.kv,.ucard,.alert,.sechd,.tl>li,.cal,.tabs3,.vegcard,.favs>button,.ppbox,.choice2>.ch,.qrcard,.arrive>div,.listhd,.panel,.field,.ul>li,.skel){animation:sprout .5s cubic-bezier(.2,.9,.3,1.12) backwards;animation-delay:calc(var(--d,0) * 45ms);transform-origin:50% 100%}
@keyframes sprout{from{opacity:0;transform:translateY(16px) scale(.97)}}
.enter .mapbox g[data-go]{animation:pindrop .55s var(--spring) backwards;animation-delay:calc(var(--d,0) * 70ms + 150ms);transform-box:fill-box;transform-origin:50% 100%}
@keyframes pindrop{from{opacity:0;transform:translateY(-24px) scale(.6)}}
.enter .bar i,.enter .dist i span{animation:grow .9s var(--soft) .15s backwards}
@keyframes grow{from{width:0}}
.enter .vbars i{animation:growy .8s var(--spring) backwards;transform-origin:50% 100%}
.enter .vbars div:nth-child(2) i{animation-delay:.08s}.enter .vbars div:nth-child(3) i{animation-delay:.16s}
@keyframes growy{from{transform:scaleY(0)}}
/* 押したときの手ごたえ */
:is(.btn,.card,.mrow,.chip,.date,.minibtn,.ch,.mem,.thread,.prow,.todo,.menu button,.round,.favb,.icbtn,.tabbar button,.toggle,.stepper button,.jumps button,.modesw button,.seg button,.tabs3 button,.help,.levels button){transition:transform .2s var(--spring),background-color .2s,border-color .2s,color .2s,box-shadow .2s}
:is(.btn,.minibtn,.chip,.date,.ch,.mem,.toggle,.stepper button,.round,.favb,.icbtn,.help,.levels button):not(:disabled):active{transform:scale(.94)}
:is(.card,.mrow,.thread,.prow,.todo,.menu button):active{transform:scale(.98)}
@media (hover:hover){.card:hover,.mrow:hover,.todo:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(16,40,28,.35)}}
.bump{animation:bump .42s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
/* タブバー：芽のような丸い目印が弾みながら移動する */
.tabbar{position:relative}
.tabbar button{z-index:1}
.tabind{position:absolute;top:7px;left:6px;width:calc((100% - 12px) / 4);height:30px;transform:translateX(calc(var(--i) * 100%));transition:transform .5s cubic-bezier(.3,1.35,.45,1);pointer-events:none}
.tabind::before{content:"";position:absolute;left:50%;top:0;width:56px;height:30px;transform:translateX(-50%);border-radius:15px;background:var(--g-50)}
.tabbar button.bump .ic{animation:hop .5s var(--spring)}
@keyframes hop{30%{transform:translateY(-5px) rotate(-8deg)}60%{transform:translateY(1px)}}
/* 完了のチェックは線を描くように */
.bigcheck{animation:popin .55s var(--spring) backwards}
.bigcheck .ic path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .3s ease-out forwards}
@keyframes popin{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
/* はじける葉と、降ってくる野菜 */
.leafpt{position:absolute;z-index:40;width:9px;height:9px;border-radius:0 100% 0 100%;background:var(--g);pointer-events:none;animation:fly .75s cubic-bezier(.2,.8,.3,1) forwards}
.leafpt.fruit{border-radius:50%;background:var(--warm);width:7px;height:7px}
@keyframes fly{from{transform:translate(-50%,-50%) rotate(0) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(.3);opacity:0}}
.rain{position:absolute;top:-40px;width:32px;height:32px;z-index:45;pointer-events:none;animation:fall 1.6s cubic-bezier(.45,.05,.6,1) both}
.rain svg{width:100%;height:100%;display:block}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(var(--h,860px)) rotate(var(--r));opacity:.85}}
/* 読み込み中の骨組み */
.skel{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.skel i{display:block;background:linear-gradient(90deg,var(--bg) 0%,var(--g-50) 50%,var(--bg) 100%);background-size:200% 100%;animation:shimmer 1s linear infinite;border-radius:6px}
.skel .sk-ph{height:132px;border-radius:0}
.skel .sk-l{height:12px;margin:0 14px}
.skel .w40{width:40%}.skel .w60{width:60%}.skel .w90{width:90%}
@keyframes shimmer{to{background-position:-200% 0}}
/* シート・通知・ヘッダー */
.sheet{animation:sheetup .4s cubic-bezier(.2,.9,.3,1.08)}
.sheet-bg{animation:fadein .25s ease-out}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}
.toast:not([hidden]){animation:toastin .5s var(--spring)}
.toast:not([hidden]) .ic{animation:popin .5s var(--spring) .1s backwards}
@keyframes toastin{from{transform:translateY(24px) scale(.92);opacity:0}}
.hd,.bar-title{transition:box-shadow .25s}
.view.scrolled .hd,.view.scrolled .bar-title{box-shadow:0 8px 18px -12px rgba(10,30,20,.45);position:relative;z-index:2}
.hero{overflow:hidden}
.hero .art{will-change:transform}
.rng:active::-webkit-slider-thumb{transform:scale(1.18)}
.rng::-webkit-slider-thumb{transition:transform .2s var(--spring)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- ランク・収穫バッジ・称号 ---------- */
.emb{display:block;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.rankcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.rankcard>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rankcard>.ic{color:var(--ink-3)}
.rn{display:flex;align-items:baseline;gap:8px}
.rn b{font-family:var(--f-round);font-weight:800;font-size:20px}
.rn small{color:var(--ink-3);font-size:12px}
.pbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;width:100%}
.pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--amber))}
.nx{font-size:11.5px;color:var(--ink-2)}
.titles{display:flex;flex-wrap:wrap;gap:4px}
.ttl{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--amber-50);color:var(--ink);display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.ttl .ic{width:12px;height:12px;color:var(--amber)}
.rhero{background:var(--card);border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.rhero .rnm{font-family:var(--f-round);font-weight:800;font-size:24px;line-height:1.2}
.rhero .rxp{font-size:13px;color:var(--ink-2)}
.rhero .rxp b{font-family:var(--f-round);font-size:18px;color:var(--ink)}
.rhero small{font-size:12px;color:var(--ink-2)}
.ladder{background:var(--card);border-radius:16px;padding:4px 14px}
.ladder>div{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ladder>div:last-child{border:0}
.ladder>div>span{flex:1;min-width:0}
.ladder b{display:block;font-size:14px}
.ladder small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.ladder>div.now{background:var(--g-50);margin:0 -14px;padding:10px 14px}
.ladder>div.lock .emb{filter:grayscale(.85);opacity:.5}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cbadge{background:var(--card);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ring{width:62px;height:62px;border-radius:50%;padding:4px;background:conic-gradient(var(--g) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center}
.ring>span{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;overflow:hidden}
.ring svg{width:40px;height:40px}
.cbadge.none .ring svg{filter:grayscale(1);opacity:.45}
.cbadge b{font-size:12px;line-height:1.3}
.cbadge small{font-size:10.5px;color:var(--ink-3);line-height:1.35}
.tier{font-size:10px;font-weight:800;border-radius:999px;padding:0 7px;color:#2A2A1F;background:var(--tc)}
.master{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.master>div{flex:1;min-width:0}
.master>.ic{width:28px;height:28px;color:var(--amber);flex:none}
.master.got{background:var(--amber-50)}
.master b{display:block;font-size:14px}
.master small{display:block;font-size:11.5px;color:var(--ink-2)}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.f{background:var(--g)}
.earn{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--g-100)}
.earn .eh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.earn .eh b{font-size:14px}
.earn .eh small{font-size:11.5px;color:var(--ink-2);text-align:right}
.earn .big{font-family:var(--f-round);font-weight:800;font-size:28px;color:var(--g-ink)}
.earn ul{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.earn li{display:flex;justify-content:space-between;gap:8px}
.earn li b{color:var(--ink);font-family:var(--f-round)}
.pbar i.fromto{animation:growfrom 1.3s var(--soft) .5s backwards}
@keyframes growfrom{from{width:var(--from)}}
.unlock{display:flex;align-items:center;gap:12px;background:var(--amber-50);border-radius:14px;padding:10px 12px;animation:popin .6s var(--spring) .9s backwards}
.unlock>.ic{width:30px;height:30px;color:var(--amber);flex:none}
.unlock b{display:block;font-size:14px}
.unlock small{font-size:12px;color:var(--ink-2)}
.ubadge{width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--tc);display:grid;place-items:center;flex:none}
.ubadge svg{width:30px;height:30px}
.fbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.fb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--amber-50);color:var(--ink);white-space:nowrap}
.fb .ic{width:11px;height:11px;color:var(--amber)}
.fb.new{background:var(--warm-50);color:var(--warm)}
.fb.new .ic{color:var(--warm)}
.cfarm .fb{margin-left:2px}
.fblist{display:flex;flex-direction:column;gap:10px}
.fblist>div{display:flex;gap:10px;align-items:center}
.fbi{width:38px;height:38px;border-radius:12px;background:var(--amber-50);display:grid;place-items:center;flex:none}
.fbi .ic{color:var(--amber)}
.fbi.new{background:var(--warm-50)}
.fbi.new .ic{color:var(--warm)}
.fblist b{display:block;font-size:13.5px}
.fblist small{font-size:12px;color:var(--ink-2)}
.rk{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle;color:var(--ink-2)}
.rk .emb{width:18px;height:18px}
.cb{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:0 7px;margin-left:4px;background:var(--g-50);color:var(--g-ink);vertical-align:middle}
.ptpv{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--g-ink);font-weight:700;margin:0}
.ptpv .ic{width:16px;height:16px;color:var(--amber);flex:none}
.ptpv.sub{color:var(--ink-2);font-weight:500}
.ptpv.sub .ic{color:var(--g)}
.rup{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.rup .emb{animation:rankin .9s var(--spring)}
@keyframes rankin{from{transform:scale(.2) rotate(-200deg);opacity:0}}
.rup.rdown .emb{animation:shake .6s .2s}
@keyframes shake{20%,60%{transform:translateX(-6px) rotate(-8deg)}40%,80%{transform:translateX(6px) rotate(8deg)}}
.rarrow{display:flex;align-items:center;gap:12px;color:var(--danger)}
.enter :is(.rankcard,.cbadge,.master,.ladder>div,.earn,.rhero,.fblist>div){animation:sprout .5s cubic-bezier(.2,.9,.3,1.12) backwards;animation-delay:calc(var(--d,0) * 45ms)}
.enter .pbar i:not(.fromto){animation:grow .9s var(--soft) .2s backwards}
.enter .ring{animation:popin .6s var(--spring) backwards;animation-delay:calc(var(--d,0) * 45ms + 100ms)}

/* ---------- 農家モード：高齢の方にも読みやすい大きな文字 ---------- */
.screen.big{--ink-3:var(--ink-2);font-size:17px;line-height:1.7}
.screen.xl .view{zoom:1.12}
.screen.big .view.in-fwd,.screen.big .view.in-back{animation:inTab .25s ease-out}
.screen.big .enter *{animation:none !important}
.screen.big small{font-size:15px}
.screen.big .bar-title h2,.screen.big .hdrow h2{font-size:22px}
.screen.big .icbtn{width:52px;height:52px}
.screen.big .icbtn .ic{width:28px;height:28px}
.screen.big .btn{height:64px;font-size:20px;border-radius:16px}
.screen.big .btn.sm{height:56px;font-size:18px}
.screen.big .btn .ic{width:24px;height:24px}
.screen.big .minibtn{font-size:16px;padding:10px 14px;border-radius:12px;border-width:2px}
.screen.big .minibtn .ic{width:20px;height:20px}
.screen.big .pill{font-size:15px;padding:4px 12px}
.screen.big .fine,.screen.big .hint{font-size:15px;color:var(--ink-2)}
.screen.big .sechd b{font-size:19px}
.screen.big .sechd small{font-size:14px}
.screen.big .tabbar{padding:8px 6px 20px;gap:4px}
.screen.big .tabbar button{font-size:15px;gap:4px;padding:6px 0;border-radius:14px;color:var(--ink-2)}
.screen.big .tabbar button .ic{width:30px;height:30px}
.screen.big .tabbar button.on{background:var(--g);color:var(--on-g)}
.screen.big .tabind{display:none}
.screen.big .tabbar .badge{font-size:13px;min-width:22px;height:22px;border-radius:11px;left:calc(50% + 8px)}
.screen.big .fhd b{font-size:22px}
.screen.big .fhd small{font-size:15px}
.screen.big .fhd .av{width:56px;height:56px;font-size:24px}
.fzseg{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px;font-weight:700}
.fzseg .modesw{width:170px}
.fzseg .modesw button{font-size:18px;padding:8px 0}
.sheet>.btn{flex:none}
.hello{margin:0;font-size:20px;line-height:1.6}
.hello b{font-family:var(--f-round)}
.bh{margin:8px 0 -2px;font-size:20px}
.big-alert .ah{font-size:20px;line-height:1.45;align-items:flex-start}
.big-alert .ah .ic{width:32px;height:32px;flex:none}
.big-alert p{font-size:17px}
.bigacts{display:flex;flex-direction:column;gap:12px}
.bigact{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:18px 16px}
.bigact>.ic{width:40px;height:40px;color:var(--g);flex:none}
.bigact>span{flex:1;min-width:0}
.bigact b{display:block;font-size:22px;line-height:1.3}
.bigact small{display:block;font-size:16px;color:var(--ink-2);margin-top:2px}
.bigact em{font-style:normal;background:var(--warm);color:#fff;font-family:var(--f-round);font-weight:800;font-size:22px;min-width:40px;height:40px;border-radius:20px;display:grid;place-items:center;padding:0 10px;flex:none}
.bigact.hot{border-color:var(--warm);background:var(--warm-50)}
.bigrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px;border:2px solid var(--line)}
.bigrow>span:not(.bd){flex:1;min-width:0}
.bigrow b{display:block;font-size:19px;line-height:1.35}
.bigrow small{display:block;font-size:16px;color:var(--ink-2)}
.bigrow>.ic{width:28px;height:28px;color:var(--ink-2);flex:none}
.bigrow>.ic:first-child{color:var(--g)}
.bd{flex:none;width:80px;text-align:center;background:var(--g-50);border-radius:14px;padding:8px 0;color:var(--g-ink);font-weight:800;font-size:15px;line-height:1.25}
.bigrow .bd b{font-family:var(--f-round);font-size:20px;white-space:nowrap;color:var(--g-ink)}
.bigtext{margin:0;font-size:17px}
.bigtext b{font-family:var(--f-round);font-size:20px}
.screen.big .applicant{padding:18px;gap:14px;border:2px solid var(--line)}
.screen.big .applicant .ah b{font-size:22px}
.screen.big .applicant .ah small{font-size:16px}
.screen.big .applicant blockquote{font-size:17px;padding:12px 14px}
.screen.big .applicant .for{flex-direction:column;font-size:16px;gap:2px;color:var(--ink-2)}
.screen.big .applicant .for b{font-size:18px}
.screen.big .applicant .row2{flex-direction:column}
.screen.big .applicant .row2 .btn{flex:none}
.screen.big .rk{font-size:14px}
.screen.big .rk .emb{width:22px;height:22px}
.screen.big .cb{font-size:14px;padding:2px 10px}
.screen.big .gm b{font-size:16px}
.screen.big .gm small{font-size:15px}
.screen.big .grp{font-size:16px}
.screen.big .toggle b{font-size:18px}
.screen.big .sw{width:60px;height:34px;border-radius:17px}
.screen.big .sw::after{width:28px;height:28px}
.screen.big .sw.on::after{left:29px}
.screen.big .qrcard .qr{width:250px;height:250px}
.screen.big .qrcard b{font-size:20px}
.screen.big .prog b{font-size:40px}
.screen.big .prog span{font-size:18px}
.screen.big .arrive>div>span:nth-child(2){font-size:19px}
.screen.big .prow .pt b{font-size:19px}
.screen.big .prow .pd{font-size:16px}
.screen.big .prow .pf{font-size:15px}
.screen.big .steps{display:none}
.stepbig{display:none}
.screen.big .stepbig{display:block;margin:0;padding:0 16px 14px;background:var(--card);font-size:17px;color:var(--ink-2)}
.screen.big .stepbig b{color:var(--ink);font-size:21px}
.screen.big .field>label,.screen.big .field>.fl{font-size:19px}
.screen.big input.in,.screen.big select.in,.screen.big textarea.ta{font-size:20px;padding:14px;border-width:2px;border-radius:14px}
.screen.big .stepper button{width:64px;height:60px;font-size:28px}
.screen.big .stepper b{width:80px;font-size:22px}
.screen.big .levels b{font-size:17px}
.screen.big .levels small{font-size:13px}
.screen.big .chip{font-size:16px;padding:8px 14px}
.screen.big .warn,.screen.big .okmsg{font-size:16px}
.screen.big .kv div{font-size:17px}
.screen.big .thread b{font-size:18px}
.screen.big .thread p{font-size:16px}
.screen.big .msg .bub{font-size:18px}
.screen.big .composer input{font-size:18px;padding:14px 18px}
.screen.big .composer button{width:54px;height:54px}
.screen.xl .composer button{width:60px;height:60px}
.screen.big .sheet h3{font-size:24px}
.screen.big .sheet p{font-size:18px}
.screen.big .radios label{font-size:18px;padding:14px}
.screen.big .radios input{width:24px;height:24px}
.screen.big .toast{font-size:17px;padding:16px 18px;bottom:110px}
.screen.big .notice{font-size:15px}
.screen.big .ban ul{font-size:16px}
.screen.big .ipv{font-size:16px}
.screen.big .photos>div{width:96px;height:96px}
.screen.big .dsec h2{font-size:19px}
.screen.big .pill{white-space:nowrap}
.screen.big .prow .pt{flex-direction:column-reverse;align-items:flex-start;gap:6px}
.screen.big .prow .pb{flex-direction:column;align-items:stretch}
.screen.big .prow .pb .minibtn{justify-content:center;padding:12px}
.screen.big .gm{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:4px}
.screen.big .gm>.pill{grid-column:2;justify-self:start}
.screen.big .applicant .ah small{flex-wrap:wrap;column-gap:10px}
.screen.big .toggle{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:6px;align-items:center}
.screen.big .toggle>div{grid-column:1}
.screen.big .toggle>.pill{grid-column:1;justify-self:start}
.screen.big .toggle>.sw{grid-column:2;grid-row:1 / span 2}
.ban ul{overflow-wrap:anywhere}
@media (max-width:400px){
  .kidrow{grid-template-columns:1fr}
  .kidrow>div{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
}
.sortnote{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.sortnote .ic{width:16px;height:16px;color:var(--amber)}
.screen.big .sortnote{font-size:17px}
.screen.big .sortnote .ic{width:22px;height:22px}
.invhero{background:var(--g);color:var(--on-g);border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.invgift{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.invgift .ic{width:30px;height:30px}
.invhero b{font-size:18px;line-height:1.5}
.invhero em{font-style:normal;font-family:var(--f-round);font-size:28px;font-weight:800}
.invhero small{font-size:12.5px;opacity:.9}
/* 評価は「良かった／残念だった」の2つ */
.gb{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-family:var(--f-round)}
.gb .up,.gb .down{display:inline-flex;align-items:center;gap:2px}
.gb .ic{width:14px;height:14px}
.gb .up{color:var(--g-ink)}
.gb .down{color:var(--ink-3)}
.gbt{display:inline-flex;align-items:center;gap:2px;font-weight:800;color:var(--g-ink);font-family:var(--f-round)}
.gbt .ic{width:14px;height:14px}
.gbsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbsum>div{border-radius:14px;padding:12px;display:flex;align-items:center;gap:8px}
.gbsum .up{background:var(--g-50);color:var(--g-ink)}
.gbsum .down{background:var(--bg);color:var(--ink-2)}
.gbsum .ic{width:26px;height:26px;flex:none}
.gbsum b{font-family:var(--f-round);font-size:22px;font-weight:800;line-height:1.1}
.gbsum span{display:block;font-size:12px;font-weight:700}
.gbbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gbbar i{display:block;height:100%;background:var(--g);border-radius:4px}
.gbc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbc button{border:2px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px;background:var(--card);color:var(--ink-2)}
.gbc .ic{width:34px;height:34px}
.gbc button.on.up{border-color:var(--g);background:var(--g-50);color:var(--g-ink)}
.gbc button.on.down{border-color:var(--ink-2);background:var(--bg);color:var(--ink)}
.rv-gb{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;flex:none}
.rv-gb.up{background:var(--g-50);color:var(--g-ink)}
.rv-gb.down{background:var(--bg);color:var(--ink-2)}
.rv-gb .ic{width:13px;height:13px}
.screen.big .gb .ic{width:18px;height:18px}
.screen.big .gbc button{font-size:19px;padding:18px 8px}
.screen.big .gbc .ic{width:40px;height:40px}
.modecard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--ink);color:var(--card);border-radius:18px;padding:14px 16px}
.modecard>span{flex:1;min-width:0}
.modecard b{display:block;font-size:16px}
.modecard small{display:block;font-size:12px;opacity:.8}
.modecard>.ic{flex:none}
.modecard>.ic:first-child{width:34px;height:34px;color:var(--g)}
.modecard>.ic:last-child{width:22px;height:22px}
.gm small b{display:inline;font-size:inherit;color:var(--g-ink);font-family:var(--f-round)}
.arate{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--g-50)}
.arate .ar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arate .ar-top span{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--g-ink)}
.arate .ar-top .ic{width:18px;height:18px}

/* ---------- モーション追加：アイコンの動き・引っぱって更新・送信の手ごたえ（参加者モードのみ。農家モードは静かに） ---------- */
/* タブを開いたとき、アイコンが一度だけそれぞれの動きをする */
.tabbar button.mofx[data-tab="search"] .ic{animation:moLens .7s ease-in-out;transform-origin:46% 46%}
.tabbar button.mofx[data-tab="schedule"] .ic{animation:moFlip .6s var(--soft);transform-origin:50% 22%}
.tabbar button.mofx[data-tab="messages"] .ic{animation:moPop .55s var(--spring);transform-origin:20% 85%}
.tabbar button.mofx[data-tab="mypage"] .ic{animation:moNod .7s ease-in-out;transform-origin:50% 90%}
@keyframes moLens{20%{transform:rotate(-16deg) translate(-1px,-1px)}45%{transform:rotate(12deg)}70%{transform:rotate(-6deg)}}
@keyframes moFlip{35%{transform:perspective(80px) rotateX(75deg)}70%{transform:perspective(80px) rotateX(-12deg)}}
@keyframes moPop{0%{transform:scale(.55)}55%{transform:scale(1.18)}}
@keyframes moNod{25%{transform:translateY(2px) rotate(-6deg)}50%{transform:translateY(-1px)}75%{transform:translateY(1.5px) rotate(4deg)}}
/* 未読があるときだけ、ベルがそっと揺れる */
.icbtn.moring .ic{animation:moRing 1.1s ease-in-out .5s;transform-origin:50% 12%}
.icbtn.moring .dot{animation:moDot 1.2s ease-out .6s}
@keyframes moRing{10%{transform:rotate(16deg)}22%{transform:rotate(-13deg)}34%{transform:rotate(9deg)}46%{transform:rotate(-6deg)}58%{transform:rotate(3deg)}70%{transform:rotate(0)}}
@keyframes moDot{from{box-shadow:0 0 0 0 var(--warm)}to{box-shadow:0 0 0 9px transparent}}
/* 芽のイラスト（空の画面・引っぱって更新で共通） */
.mo-stem{fill:none;stroke:var(--g);stroke-width:2.6;stroke-linecap:round}
.mo-lf{fill:var(--g-100);stroke:var(--g);stroke-width:1.8;stroke-linejoin:round;transform-box:fill-box}
.mo-lf1{transform-origin:100% 100%}
.mo-lf2{transform-origin:0 100%}
.mosprout{width:64px;height:64px;overflow:visible;flex:none}
.mosprout .mo-soil{fill:var(--line)}
.mosprout .mo-stem{stroke-width:3}
.mogrow .mosprout .mo-soil{animation:moSoil .4s var(--soft) backwards;transform-box:fill-box;transform-origin:50% 50%}
.mogrow .mosprout .mo-stem{stroke-dasharray:24;animation:moStem .5s ease-out .25s backwards}
.mogrow .mosprout .mo-lf1{animation:moLeaf .55s var(--spring) .6s backwards,moSwayL 2.6s ease-in-out 1.3s 4 alternate}
.mogrow .mosprout .mo-lf2{animation:moLeaf .55s var(--spring) .72s backwards,moSwayR 2.6s ease-in-out 1.4s 4 alternate}
.empty.mogrow>.ic{animation:moRise .6s var(--spring) backwards}
@keyframes moSoil{from{transform:scaleX(0);opacity:0}}
@keyframes moStem{from{stroke-dashoffset:24}}
@keyframes moLeaf{from{transform:scale(0)}}
@keyframes moSwayL{to{transform:rotate(-7deg)}}
@keyframes moSwayR{to{transform:rotate(7deg)}}
@keyframes moRise{from{transform:translateY(12px) scale(.6);opacity:0}}
/* 引っぱって更新：引くほど芽が伸び、離すと実がなって閉じる */
.mopull{--k:0;height:0;flex:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:var(--ink-3);font-size:11.5px;font-weight:700;line-height:1.5}

function qr(seed){
  const n=25;let r=seed;const rnd=()=>(r=(r*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  let s='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inF(x,y)&&rnd()>.5)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" style="fill:var(--qr-bg)"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg class="qr" viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" aria-label="チェックイン用QRコード"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" style="fill:var(--qr-bg)"/><g style="fill:var(--qr-fg)">${f(0,0)}${f(n-7,0)}${f(0,n-7)}${s}</g></svg>`;
}
