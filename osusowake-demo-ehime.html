/* ===== 日付の自動更新 =====
   画面のデータは「2026/10/29 を今日」とした暦で書かれている。表示するときだけ、開いた日の今日に合わせてずらす。
   画面の文字（10/31(土)、2026年10月29日 など）を描画のたびに書き換えるので、募集はいつ開いても今日から先の日付になる */
const BASE_DAY=new Date(2026,9,29);
const TODAY0=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const DOFF=Math.round((TODAY0-BASE_DAY)/864e5);
const WD='日月火水木金土';
const baseOf=(m,d)=>new Date(m>=7?2026:2027,m-1,d);
const realOf=md=>{const[m,d]=String(md).split('/').map(Number),b=baseOf(m,d);return new Date(b.getFullYear(),b.getMonth(),b.getDate()+DOFF)};
const rwd=dt=>WD[dt.getDay()];
const ymd=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const MD_RE=/(?<![\d/.:])(\d{1,2})\/(\d{1,2})(?![\d/])(\([月火水木金土日](?:・祝)?\))?/g;
const YMD_RE=/2026年(\d{1,2})月(\d{1,2})日/g;
function shiftText(t){
  t=t.replace(YMD_RE,(a,m,d)=>{const r=new Date(2026,m-1,+d+DOFF);return `${r.getFullYear()}年${r.getMonth()+1}月${r.getDate()}日`});
  return t.replace(MD_RE,(a,m,d,w)=>{m=+m;d=+d;if(m<8||m>12||d<1||d>31)return a;const r=realOf(m+'/'+d);return `${r.getMonth()+1}/${r.getDate()}`+(w?`(${rwd(r)})`:'')});
}
const SHIFTED=new WeakMap();
function shiftNode(root){
  if(!DOFF||!root)return;
  if(root.nodeType===3)root=root.parentNode;if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){const pn=n.parentNode;if(!pn||/^(SCRIPT|STYLE|TEXTAREA)$/.test(pn.nodeName))continue;
    if(SHIFTED.get(n)===n.data)continue;const t=shiftText(n.data);if(t!==n.data)n.data=t;SHIFTED.set(n,n.data)}
}
new MutationObserver(ms=>ms.forEach(m=>m.type==='characterData'?shiftNode(m.target):m.addedNodes.forEach(shiftNode)))
  .observe(document.documentElement,{subtree:true,childList:true,characterData:true});

(function genJobs(){
  const seed=TODAY0.getFullYear()*372+TODAY0.getMonth()*31+TODAY0.getDate(),tpl=JOBS.slice();
  const SLOTS=[['8:30','11:30'],['9:00','12:00'],['13:00','15:30'],['9:30','12:00'],['14:00','16:30']];

  let id=101;
  DATES.forEach((d,di)=>{
    const want=2+((seed+di)%2);
    for(let k=0;JOBS.filter(j=>j.date===d).length<want&&k<tpl.length;k++){
      const t=tpl[(seed+di*3+k)%tpl.length];
      if(JOBS.some(j=>j.date===d&&j.farm===t.farm))continue;
      const sl=SLOTS[(seed+di+k)%SLOTS.length],j={...t,id:id++,date:d,time:sl[0],end:sl[1],gen:true,urgent:(seed+di+k)%5===0,deadline:di===0?'受付終了':dl(d)};
      j.minH=Math.min(t.minH,span(j));j.left=1+((seed+di*7+k*5)%t.cap);

    }
  });
})();

const amtList=(j,h)=>j.veg.map(v=>`<li><span>${v[0]}</span><b>約${amt(v,h)}</b></li>`).join('');
/* お礼の野菜がかごに落ちてくるアニメーション。数はお礼の量で決まり、参加時間では変わらない */
function fillBasket(j,h,anim){
  const box=document.getElementById('basket');if(!box)return;
  const cnt=j.veg.map(v=>Math.max(1,Math.min(14,Math.round(v[1]/v[4])))),want=[];
  for(let n=0;n<Math.max(...cnt);n++)j.veg.forEach((v,i)=>{if(n<cnt[i])want.push(i+'-'+n)});
  const have={};
  [...box.children].forEach(c=>{if(c.classList.contains('out'))return;if(want.includes(c.dataset.k))have[c.dataset.k]=c;else{c.classList.add('out');setTimeout(()=>c.remove(),220)}});
  let prev=null,added=0;
  want.forEach(k=>{
    let el=have[k];
    if(!el){const[i,n]=k.split('-').map(Number);el=document.createElement('span');el.className='vg';el.dataset.k=k;
      el.style.setProperty('--r',((n*37+i*53)%30-15)+'deg');el.innerHTML=`<svg viewBox="0 0 100 100">${V[j.veg[i][3]]}</svg>`;
      if(anim){el.classList.add('pop');el.style.animationDelay=(added++*60)+'ms';el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true})}}
    const at=prev?prev.nextSibling:box.firstChild;
    if(at!==el)box.insertBefore(el,at);
    prev=el;
  });
}
function seek(el){
  const j=J(el.dataset.job),mx=span(j);let h=+el.value;
  if(h<j.minH){h=j.minH;el.value=h;const nm=document.getElementById('minnote');nm.classList.remove('flash');void nm.offsetWidth;nm.classList.add('flash')}
  if(S.hours[j.id]===h)return;
  S.hours[j.id]=h;el.style.setProperty('--vl',h/mx);
  document.getElementById('hv').textContent=fmtH(h);
  document.getElementById('hend').textContent=addT(j.time,h);
  const pv=document.getElementById('ptv');if(pv)pv.textContent=xpFor(h,total(PK(j)),j);
}
/* ランク：経験値はお手伝いの時間（チェックイン〜チェックアウト）で貯まる。何とも交換できない */
const RANKS=[
  {n:'新人',min:0,c:'#7CC784',c2:'#3E8E47',perk:'はじめの一歩'},
  {n:'ブロンズ',min:60,c:'#D9A066',c2:'#9B6230',perk:'プロフィールにランクを表示'},
  {n:'シルバー',min:180,c:'#C3CCD2',c2:'#7D8A93',perk:'応募者一覧で農家さんの目にとまりやすく'},
  {n:'ゴールド',min:360,c:'#F4CE55',c2:'#B8891A',perk:'農家さんの自動承認の対象になれる'},
  {n:'プラチナ',min:600,c:'#A6E3E0',c2:'#4C9FA0',perk:'お気に入り農家の新着を先に受け取れる'},
  {n:'マスター',min:960,c:'#B49BEE',c2:'#6545C2',perk:'称号「頼れる収穫人」'},
  {n:'プロフェッショナル',min:1440,c:'#25352D',c2:'#E8C35A',perk:'農家さんへのおすすめ表示'}
];
const rankOf=xp=>RANKS.reduce((a,r,i)=>xp>=r.min?i:a,0);
const emblem=(i,sz=44)=>{const r=RANKS[i];return `<svg class="emb" width="${sz}" height="${sz}" viewBox="0 0 48 48" role="img" aria-label="${r.n}"><path d="M24 3 42 13v22L24 45 6 35V13z" fill="${r.c}" stroke="${r.c2}" stroke-width="2.5"/><path d="M24 9 37 16.5v15L24 39 11 31.5v-15z" fill="rgba(255,255,255,.22)"/>${
  i===0?`<path d="M24 33v-9M24 26c0-4-3-6-7-6 0 4 3 6 7 6zM24 24c0-4 3-6 7-6 0 4-3 6-7 6z" stroke="${r.c2}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
  :i<5?`<path d="M15 32c0-10 7-16 18-16 0 10-6 17-16 17M15 32l9-9" stroke="${r.c2}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
  :`<path d="m24 13 3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L24 29.5l-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1z" fill="${r.c2}"/>`}</svg>`};
/* なかまボーナス：2人で1.2倍、3人以上で1.3倍（子どもも人数に数える。一緒に参加したアカウント全員に付く） */
const groupRate=n=>n>=3?.3:n>=2?.2:0;
/* キャンペーン：運営が期間・エリア・作物を絞って経験値を増やす（なかまボーナスは対象外） */
const CAMPS=[{name:'みかん収穫応援',type:'mul',val:2,from:'10/24',to:'11/8',cities:['伊予市','砥部町'],crop:'みかん'},
  {name:'柿シーズン開幕',type:'add',val:20,from:'11/1',to:'11/15',cities:['内子町'],crop:'柿'}];
const mdN=d=>{const [m,dd]=String(d).split('/').map(x=>parseInt(x));return m*100+dd};
const campOf=j=>j&&CAMPS.find(c=>mdN(j.date)>=mdN(c.from)&&mdN(j.date)<=mdN(c.to)&&c.cities.includes(j.city)&&(j.title+j.veg.map(v=>v[0]).join('')).includes(c.crop));
const campLbl=c=>c.type==='mul'?`経験値${c.val}倍`:`経験値+${c.val}`;
const xpParts=(h,n=1,j)=>{const base=Math.floor(h*6),long=h>=3?25:h>=2?10:0,group=Math.round((base+long)*groupRate(n)),c=campOf(j),camp=c?(c.type==='mul'?Math.round((base+long)*(c.val-1)):c.val):0;return{base,long,group,camp,campName:c?c.name+'（'+campLbl(c)+'）':'',total:base+long+group+camp}};
const xpFor=(h,n=1,j)=>xpParts(h,n,j).total;
const fmtHM=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}時間${m%60?m%60+'分':''}`};
/* 収穫バッジ：同じ作物の合計時間で育つ */
const CROPS=[['みかん','fruit','mikan'],['伊予柑','fruit','mikan'],['キウイ','fruit','kiwi'],['柿','fruit','persimmon'],['栗','fruit','chestnut'],
  ['さつまいも','veg','sweetpotato'],['里芋','veg','taro'],['大根','veg','daikon'],['にんじん','veg','carrot'],['ミニトマト','veg','tomato'],['なす','veg','eggplant']];
const CTIER=[['ブロンズ',3,'#D9A066'],['シルバー',15,'#C3CCD2'],['ゴールド',30,'#F4CE55'],['プラチナ',60,'#A6E3E0']];
const cropTier=h=>CTIER.reduce((a,t,i)=>h>=t[1]?i:a,-1);
const masters=()=>{const ok=c=>(S.me.ch[c[0]]||0)>=3,f=CROPS.filter(c=>c[1]==='fruit'&&ok(c)).length,v=CROPS.filter(c=>c[1]==='veg'&&ok(c)).length;return{f,v}};
function myTitles(){
  const t=[],m=masters();if(m.f>=5)t.push('果物マスター');if(m.v>=5)t.push('野菜マスター');
  CROPS.map(c=>[c[0],S.me.ch[c[0]]||0]).filter(x=>cropTier(x[1])>=0).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(x=>t.push(x[0]+CTIER[cropTier(x[1])][0]));
  return t;
}
const rankCard=()=>{const ri=rankOf(S.me.xp),nx=RANKS[ri+1],pc=nx?Math.round((S.me.xp-RANKS[ri].min)/(nx.min-RANKS[ri].min)*100):100;
  return `<button class="rankcard" data-go="rank">${emblem(ri,58)}<div><div class="rn"><b>${RANKS[ri].n}</b><small>経験値 <span data-count="${S.me.xp}">${S.me.xp}</span></small></div><div class="pbar"><i style="width:${pc}%"></i></div>
    <span class="nx">${nx?`${nx.n}まで あと${nx.min-S.me.xp}（約${Math.ceil((nx.min-S.me.xp)/6)}時間）`:'最高ランクです'}</span>
    <div class="titles">${myTitles().map(t=>`<span class="ttl">${ic('trophy')}${t}</span>`).join('')}</div></div>${ic('chev')}</button>`};
/* 農家さんのバッジ */
const FB={top:['高評価','good','好評価率95%以上'],new:['はじめての受け入れ','sprout','登録から3か月以内の新しい農家さん'],repeat:['リピーター多数','users','参加者の4割以上が2回以上参加'],
  hundred:['受け入れ100人','check','延べ100人以上を受け入れ'],nocancel:['中止が少ない','shield','農家都合の当日中止が直近6か月で0件'],teach:['教え上手','help','「丁寧に教えてくれた」の評価が多い']};
const FBADGE={'たかはし農園':['top','teach','repeat','hundred'],'東温いも畑':['nocancel'],'砥部キウイ園':['top','hundred','teach','nocancel'],'内子かきの木園':['top','repeat'],'はなみずき農園':['new','nocancel']};
const fbChips=(farm,max=9)=>(FBADGE[farm]||[]).slice(0,max).map(k=>`<span class="fb ${k==='new'?'new':''}">${ic(FB[k][1])}${FB[k][0]}</span>`).join('');
/* 評価は「良かった／残念だった」の2つだけ（星5段階の「ふつうだから3」を避ける） */
const pct=(g,b)=>g+b?Math.round(g/(g+b)*100)+'%':'—';
const goodRate=x=>x.g+x.b?x.g/(x.g+x.b):0;
const gbHtml=(g,b)=>`<span class="gb"><span class="up">${ic('good')}${g}</span><span class="down">${ic('bad')}${b}</span></span>`;
const isGood=r=>r.s>=4;
const farmGB=name=>{const f=FARMS[name],m=(S.reviews[name]||[]).filter(r=>r.mine);return{g:f.good+m.filter(isGood).length,b:f.bad+m.filter(r=>!isGood(r)).length}};

V_.schedule=()=>{
  const ent=Object.entries(S.my);
  const conf=ent.filter(e=>e[1]==='confirmed').map(e=>J(e[0])),pend=ent.filter(e=>e[1]==='pending').map(e=>J(e[0]));
  const done=[{d:'10/18',t:'さつまいも掘り（紅はるか）',f:'東温いも畑',v:'さつまいも 3.4kg'},{d:'10/4',t:'栗拾いと選別',f:'中山くり園',v:'栗 1.2kg'},{d:'9/20',t:'なすの収穫',f:'松前なす畑',v:'なす 12本'}];
  const days=[];for(let i=26;i<=31;i++)days.push('10/'+i);for(let i=1;i<=8;i++)days.push('11/'+i);
  const mark=d=>conf.some(j=>j.date===d)?'m-ok':pend.some(j=>j.date===d)?'m-wait':'';
  const c0=realOf(days[0]),c1=realOf(days[days.length-1]),lead=(c0.getDay()+6)%7;
  const cal=`<div class="cal"><div class="calhd"><b>${c0.getMonth()+1}月${c0.getDate()}日 〜 ${c1.getMonth()+1}月${c1.getDate()}日</b><small><span><i class="m-ok"></i>確定</span><span><i class="m-wait"></i>承認待ち</span></small></div>
    <div class="calg">${['月','火','水','木','金','土','日'].map(w=>`<span class="w ${w==='土'?'sat':w==='日'?'sun':''}">${w}</span>`).join('')}
    ${'<span class="d blank" aria-hidden="true"></span>'.repeat(lead)}${days.map(d=>{const m=mark(d);return `<span class="d ${d==='10/29'?'today':['10/26','10/27','10/28'].includes(d)?'past':''}">${realOf(d).getDate()}${m?`<i class="${m}"></i>`:''}</span>`}).join('')}</div></div>`;
  const plan=(j,kind)=>`<div class="plan"><div class="ptop"><div class="ph ph-${j.bg}">${photo(j.kinds)}</div><div style="flex:1;min-width:0">
      <div class="when">${fd(j.date)} 受付${j.time}〜・${fmtH(hoursOf(j))} ${kind==='c'?'<span class="pill g">確定</span>':'<span class="pill line">承認待ち・残り23時間</span>'}</div>
      <b class="t">${j.title}</b><small>${j.farm}・${j.meet}</small><small>${partyText(PK(j))}</small></div></div>
    ${kind==='c'?`<div class="pact"><button class="btn sm" data-go="checkin">${ic('qr')}当日のチェックイン（デモ）</button></div>
    <div class="pfoot"><button data-go="chat:1">${ic('chat')}メッセージ</button><button data-act="toast:端末のカレンダーに追加しました">${ic('cal')}カレンダーに追加</button><button data-act="sheet:cancel">${ic('x')}キャンセル</button></div>`
    :`<div class="pfoot"><span>農家さんの承認を待っています</span><button data-act="withdraw:${j.id}">${ic('x')}取り消す</button></div>`}</div>`;
  let list;
  if(S.schedTab==='confirmed')list=conf.length?conf.map(j=>plan(j,'c')).join(''):`<div class="empty">${ic('cal')}<b>確定した予定はありません</b></div>`;
  else if(S.schedTab==='pending')list=pend.length?pend.map(j=>plan(j,'p')).join(''):`<div class="empty">${ic('clock')}<b>承認待ちの応募はありません</b><small>募集詳細から応募すると、ここに表示されます</small></div>`;
  else list=`<div class="hist">${done.map(x=>`<div><time>${x.d}</time><span><b style="font-family:inherit">${x.t}</b><br><small style="color:var(--ink-2)">${x.f}・${x.v}</small></span><span class="pill g" style="flex:none">評価ずみ</span></div>`).join('')}</div>`;
  return{ids:['P-05 マイ収穫カレンダー','P-07 キャンセル','C-01 メッセージ'],
    header:homeBar('予定',`<button class="icbtn" data-act="toast:端末のカレンダーと同期しました" aria-label="カレンダーと同期">${ic('cal')}</button>`),
    body:`<div class="pad">${cal}<div class="tabs3">${[['confirmed','確定',conf.length],['pending','承認待ち',pend.length],['done','完了',3]].map(([k,t,n])=>`<button class="${S.schedTab===k?'on':''}" data-act="stab:${k}">${t}<em>${n}</em></button>`).join('')}</div>${list}</div>`};
};

V_.link=()=>{

    body=`<div class="tabs3 tabs2"><button class="${L.tab==='id'?'on':''}" data-act="lktab:id">IDでさがす</button><button class="${L.tab==='qr'?'on':''}" data-act="lktab:qr">QRで連携</button></div>`+
    (L.tab==='qr'?`<div class="qrcard">${qr(77)}<b>@${MYID}</b><small>相手にこのQRを読み取ってもらいます。対面での確認になるので、確認コードは不要です。QRは5分ごとに変わるため、スクリーンショットでは使えません。</small></div>

    :`<div class="field"><label for="lkq">相手のアカウントID</label><div class="idin"><span>@</span><input class="in" id="lkq" value="${L.q}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：kenta_iyo"></div>

      <button class="btn sm" data-act="lksearch">${ic('search')}さがす</button>

      ${warn(L.err)}
      ${u?`<div class="ucard"><div class="uh"><span class="av">${u.name[0]}</span><div><b>${u.name}</b><small>@${L.found}</small></div>${u.kyc?`<span class="pill g">${ic('shield')}本人確認ずみ</span>`:'<span class="pill red">本人確認前</span>'}</div>
        <div class="statrow"><div class="stat"><b>${pct(u.g,u.b)}</b><span>好評価率</span></div><div class="stat"><b>${u.count}<small>回</small></b><span>参加回数</span></div><div class="stat"><b>${u.cancel}<small>回</small></b><span>キャンセル</span></div></div>
        ${!u.kyc?warn('本人確認が済んでいないアカウントとは連携できません。相手に本人確認をお願いしてください'):u.stop?warn('このアカウントは現在、応募が停止されているため連携できません'):
        `<div class="field"><label for="lkrel">あなたとの関係</label><select class="in" id="lkrel">${['友だち','家族','その他'].map(r=>`<option ${r===L.rel?'selected':''}>${r}</option>`).join('')}</select></div>
         <button class="btn" data-act="lkreq">連携リクエストを送る</button>
         <p class="fine">相手が承認し、相手の画面に出る確認コードをあなたが入力すると、連携が完了します。</p>`}</div>`:''}`);

      ${warn(L.err)}
      <p class="fine">コードは10分で無効になります。知らない人からメッセージやSNSで送られてきたコードは入力しないでください。</p>
      <button class="minibtn" data-go="linkreq" style="align-self:center">${ic('user')}相手の画面を見る（デモ）</button>`;
    cta=`<button class="btn" data-act="lkcode">確認して連携する</button>`;

    const u=USERS[L.target];
    body=`<div class="done"><div class="bigcheck">${ic('check')}</div><h1>連携しました</h1><p>${u.name}さんと一緒に応募できるようになりました。一緒に応募すると、農家さんに${u.name}さんの評価と参加回数が表示されます。</p></div>
      <div class="ucard"><div class="uh"><span class="av">${u.name[0]}</span><div><b>${u.name}</b><small>@${L.target}・${L.rel}</small></div><span class="pill g">${ic('shield')}本人確認ずみ</span></div></div>`;
    cta=`<button class="btn" data-act="lkdone">完了</button>`;
  }else{
    body=`<div class="done"><div class="bigcheck" style="background:var(--danger)">${ic('alert')}</div><h1 style="font-size:19px">このリクエストは無効になりました</h1><p>確認コードを3回まちがえたため、安全のためリクエストを無効にしました。24時間後にもう一度お試しください。</p></div>`;
    cta=`<button class="btn ghost" data-act="lkdone">もどる</button>`;
  }
  return{ids:['追加 アカウントID連携','追加 承認＋確認コード','追加 本人確認ずみのみ連携'],tabs:false,header:titleBar('メンバーを連携する'),body:`<div class="pad">${body}</div>`,cta};
};

        <div class="statrow"><div class="stat"><b>${pct(u.g,u.b)}</b><span>好評価率</span></div><div class="stat"><b>${u.count}<small>回</small></b><span>参加回数</span></div><div class="stat"><b>${u.cancel}<small>回</small></b><span>キャンセル</span></div></div>
        ${q.msg?`<p>「${q.msg}」</p>`:''}</div>`;

        <li>${u.name}さんと一緒に、お手伝いに応募できるようになります</li>
        <li>一緒に応募したとき、農家さんにあなたの評価と参加回数が表示されます</li>
        <li>連携は、マイページの「参加メンバー」からいつでも解除できます</li></ul></div>
      <div class="warn">${ic('alert')}心当たりがないリクエストは承認しないでください</div>
      <button class="linkbtn" data-act="lkinrep" style="align-self:center">知らない人からのリクエストとして通報する</button>`;
    cta=`<button class="btn ghost narrow" data-act="lkinno">拒否</button><button class="btn" data-act="lkinok">承認する</button>`;
  }else if(q.st==='approved'){
    body=`${card}
      <div class="codebox"><small>確認コード</small><b>3907</b><small>このコードを、${u.name}さんに直接（会って、または電話で）伝えてください。10分で無効になります。</small></div>
      <p class="fine">${u.name}さんがこのコードを入力すると、連携が完了します。メッセージやSNSでコードを送るのはやめましょう。運営がコードをたずねることはありません。</p>
      <button class="minibtn" data-act="lkincode" style="align-self:center">${ic('user')}${u.name}さんがコードを入力した（デモ）</button>`;
    cta=`<button class="btn ghost" data-back>あとで</button>`;
  }else if(q.st==='done'){
    body=`<div class="done"><div class="bigcheck">${ic('check')}</div><h1>${u.name}さんと連携しました</h1><p>${u.name}さんと一緒に応募できるようになりました。一緒に応募すると、農家さんにあなたの評価と参加回数が表示されます。</p></div>
      <div class="ucard"><div class="uh"><span class="av amber">${u.name[0]}</span><div><b>${u.name}</b><small>@${q.from}・${q.rel}</small></div><span class="pill g">${ic('shield')}本人確認ずみ</span></div></div>`;

    cta=`<button class="btn ghost" data-back>もどる</button>`;

  return{ids:['追加 届いた連携リクエスト','追加 承認＋確認コード','C-06 通報'],tabs:false,header:titleBar('連携リクエスト'),body:`<div class="pad">${body}</div>`,cta};
};

V_.rank=()=>{
  const t=S.rtab,me=S.me,ri=rankOf(me.xp),nx=RANKS[ri+1];
  let b=`<div class="tabs3 tabs2">${[['rank','ランク'],['crop','収穫バッジ']].map(([k,l])=>`<button class="${t===k?'on':''}" data-act="rtab:${k}">${l}</button>`).join('')}</div>`;
  if(t==='rank'){
    const pc=nx?Math.round((me.xp-RANKS[ri].min)/(nx.min-RANKS[ri].min)*100):100;
    b+=`<div class="rhero">${emblem(ri,88)}<span class="rnm">${RANKS[ri].n}</span><span class="rxp">経験値 <b data-count="${me.xp}">${me.xp}</b>・お手伝い ${fmtHM(me.hours)}</span>
        <div class="pbar"><i style="width:${pc}%"></i></div><small>${nx?`${nx.n}まで あと${nx.min-me.xp}（約${Math.ceil((nx.min-me.xp)/6)}時間）`:'最高ランクです'}</small></div>
      <div class="sechd"><b>ランク一覧</b><small>お手伝いの時間で上がります</small></div>
      <div class="ladder">${RANKS.map((r,i)=>`<div class="${i===ri?'now':i>ri?'lock':''}">${emblem(i,38)}<span><b>${r.n}${i===ri?'（いまここ）':''}</b><small>経験値${r.min}〜（約${Math.round(r.min/6)}時間）・${r.perk}</small></span></div>`).join('')}</div>
      <div class="sechd"><b>経験値のしくみ</b></div>
      <ul class="ul">
        <li>${ic('clock')}<span>お手伝いの時間10分ごとに経験値1。チェックインからチェックアウトまでの時間で決まります</span></li>
        <li>${ic('star')}<span>じっくりボーナス：1回で2時間以上なら+10、3時間以上なら+25</span></li>
        <li>${ic('users')}<span>なかまボーナス：家族・友だちと2人で参加すると1.2倍、3人以上なら1.3倍。一緒に参加したメンバー全員に付きます（子どもも人数に数えます）</span></li>
        <li>${ic('send')}<span>招待ボーナス：招待した友だちが初めてのお手伝いを終えると、ふたりとも+${INVXP}</span></li>
        <li>${ic('check')}<span>回数ではなく時間で貯まるので、1回に長く参加するほど早くランクが上がります</span></li>
        <li>${ic('check')}<span>体調などで途中で帰っても、それまでの時間ぶんの経験値はつきます</span></li>
        <li>${ic('check')}<span>1回の上限は4時間です</span></li></ul>
      <div class="sechd"><b>ランクが下がるとき</b></div>
      <table class="pen"><tr><td>前日までのキャンセル</td><td>変わりません</td></tr><tr><td>当日のキャンセル</td><td>経験値 −30</td></tr><tr><td>無断欠席</td><td>2ランクダウン</td></tr><tr><td>90日以内に2回目の無断欠席</td><td>新人に戻る</td></tr></table>
      <p class="fine">ランクが下がると、経験値は下がったランクの最初からになります。</p>
      <div class="row2"><button class="btn ghost sm" data-act="rdemo:up">ランクアップの演出</button><button class="btn ghost sm" data-act="rdemo:down">無断欠席した場合</button></div>

  }else{
    const m=masters(),cb=c=>{const h=me.ch[c[0]]||0,ti=cropTier(h),n=CTIER[ti+1],lo=ti>=0?CTIER[ti][1]:0,p=n?Math.round((h-lo)/(n[1]-lo)*100):100;

      <div class="sechd"><b>野菜</b></div><div class="cgrid">${CROPS.filter(c=>c[1]==='veg').map(cb).join('')}</div>`;
  }
  return{ids:['追加 ランク（経験値＝お手伝いの時間）','追加 収穫バッジ・称号','追加 無断欠席で大幅ランクダウン'],tabs:false,header:titleBar('ランクとバッジ'),body:`<div class="pad">${b}</div>`};
};

  ['参加・キャンセル','初めてでも参加できますか？','「初めてOK」の印がある募集なら、農家さんが作業を一つずつ説明します。収穫ばさみなどの道具は、多くの募集で農家さんが用意しています。持ち物と服装は、募集詳細で確認してください。'],
  ['参加・キャンセル','応募すると、すぐに参加が決まりますか？','農家さんが24時間以内に、参加してもらうかどうかを決めます。決まるとお知らせが届き、「予定」に「確定」と表示されます。好評価率などの条件を満たしていると、すぐに承認されることもあります。'],
  ['参加・キャンセル','キャンセルするとペナルティはありますか？','前日までのキャンセルは、ペナルティはありません。当日のキャンセルは1pt（経験値−30）、連絡なしの欠席は3ptで、ランクが2つ下がります。3pt以上になると30日間応募できなくなります。ポイントは90日で消えます。',['予定を見る','data-tab="schedule"','cal']],
  ['参加・キャンセル','途中で帰ってもいいですか？','体調が悪くなったときは、途中で帰れます。ペナルティはありません。農家さんに一声かけてから、アプリでチェックアウトしてください。'],
  ['参加・キャンセル','雨の日はどうなりますか？','雨や台風などで中止になるときは、前日20:00か、集合の3時間前までにお知らせします。中止になっても、参加者のペナルティにはなりません。'],
  ['参加・キャンセル','同じ農家さんに何回でも参加できますか？','同じ農家さんへの参加は、月4回までです。ほかの農家さんの募集も、ぜひのぞいてみてください。'],
  ['保険・ケガ','保険はいつ適用されますか？','チェックインからチェックアウトまで、傷害保険と賠償責任保険が自動で適用されます。保険料の負担はありません。家から集合場所までの移動中は対象になりません。',['保険の内容を見る','data-go="insurance"','shield']],
  ['保険・ケガ','ケガをしたときは、どうすればいいですか？','命に関わるとき、大きなケガのときは、先に119番に連絡してください。そのあと、アプリの「緊急報告」から運営に知らせてください。担当者が24時間以内に連絡します。通院の領収書は保管しておいてください。',['保険と事故のときの連絡','data-go="insurance"','sos']],
  ['保険・ケガ','農作物や道具をこわしてしまったら？','賠償責任保険の対象になります。まず農家さんに伝えて、アプリの「緊急報告」から運営にも知らせてください。'],
  ['お礼の野菜','お礼の野菜の量は、どう決まりますか？','参加する時間や作業の量に関係なく、参加した全員に同じ目安でお渡しします。目安は、募集詳細の「お礼の野菜」に書いてあります。その日の収穫の状況で、品目が変わることがあります。'],
  ['お礼の野菜','お礼をお金で受け取れますか？','受け取れません。お礼は、形や大きさの都合で出荷できない野菜のおすそわけです。この参加は体験・お手伝いで、雇用契約ではありません。'],
  ['お礼の野菜','もらった野菜を売ってもいいですか？','転売はできません。お渡しするのは、未加工の生鮮品だけです。ご家族やご近所でおすそわけするのはかまいません。'],
  ['経験値・ランク','経験値はどうすると増えますか？','お手伝いの時間10分ごとに1増えます。2時間以上で+10、3時間以上で+25の「じっくりボーナス」があり、家族や友だちと2人以上で参加すると1.2〜1.3倍になります。チェックアウトしたときに確定します。',['ランクと収穫バッジを見る','data-go="rank"','trophy']],
  ['経験値・ランク','経験値をお金や商品に交換できますか？','できません。経験値は、お手伝いの記録です。お金・商品・割引などに交換することはありません。ランクや収穫バッジで、これまでの歩みを振り返れます。'],
  ['経験値・ランク','ランクが下がることはありますか？','連絡なしで欠席すると、ランクが2つ下がります。当日のキャンセルは経験値が30減ります。前日までにキャンセルすれば、ランクも経験値も変わりません。'],
  ['アカウント','本人確認はなぜ必要ですか？','農家さんと参加者が安心して会えるように、応募の前に本人確認をお願いしています。農家さんに見えるのは、ニックネーム・評価・参加回数・本人確認の有無だけです。'],
  ['アカウント','家族や友だちと一緒に応募できますか？','「参加メンバー」でアカウントを連携すると、応募のときにメンバーを選んで一緒に申し込めます。連携には、相手の承認と4桁の確認コードが必要です。',['参加メンバーを見る','data-go="members"','users']],
  ['アカウント','困った相手がいるときは？','メッセージ画面の右上にある旗のボタンから、通報やブロックができます。運営が24時間以内に内容を確認します。身の危険を感じるときは、すぐに110番に連絡してください。'],
  ['アカウント','退会したいときは？','下の「お問い合わせ」から「アカウント」を選んで連絡してください。参加が確定している予定があるときは、先にキャンセルしてください。']];
const stFaqHit=(f,cat,q)=>{if(cat!=='すべて'&&f[0]!==cat)return false;const s=(f[1]+f[2]).toLowerCase();return q.split(/[\s　]+/).filter(Boolean).every(w=>s.includes(w))};
function stFaqFilter(){
  const cat=S.stFq.cat,q=S.stFq.q.trim().toLowerCase();let n=0;
  document.querySelectorAll('.stfi').forEach(el=>{const h=stFaqHit(ST_FAQ[+el.dataset.i],cat,q);el.hidden=!h;if(h)n++});
  document.querySelectorAll('.stfg').forEach(g=>{g.hidden=!g.querySelector('.stfi:not([hidden])')});
  const c=document.getElementById('stfcnt');if(c)c.textContent=`${n}件`;
  const e=document.getElementById('stfnone');if(e)e.hidden=n>0;
}
V_.sthelp=()=>{
  const F=S.stFq,q=F.q.trim().toLowerCase(),cats=F.cat==='すべて'?ST_FC:[F.cat];let n=0;
  const item=(f,i)=>{const h=stFaqHit(f,F.cat,q),o=F.open.has(String(i));if(h)n++;
    return `<div class="mrow2 stfi ${o?'open':''}" data-i="${i}" ${h?'':'hidden'}><button class="stfq" data-act="stfaq:${i}" aria-expanded="${o}" aria-controls="stfa${i}"><span class="stqm">Q</span><b>${f[1]}</b>${ic('chev')}</button>
      <div class="stfa" id="stfa${i}" role="region"><div><div class="stfb"><p>${f[2]}</p>${f[3]?`<button class="minibtn" ${f[3][1]}>${ic(f[3][2])}${f[3][0]}</button>`:''}</div></div></div></div>`};
  const groups=cats.map(c=>{const its=ST_FAQ.map((f,i)=>f[0]===c?item(f,i):'').join(''),any=ST_FAQ.some(f=>f[0]===c&&stFaqHit(f,F.cat,q));
    return `<div class="stfg" ${any?'':'hidden'}><div class="sechd"><b>${c}</b></div><div class="memlist">${its}</div></div>`}).join('');
  return{ids:['C-07 ヘルプ・よくある質問','C-03 保険案内へのリンク'],tabs:false,header:titleBar('ヘルプ・よくある質問'),
    body:`<div class="pad">
      <div class="stsrch">${ic('search')}<input class="in" id="stfq" type="search" value="${stEsc(F.q)}" placeholder="キーワードでさがす（例：キャンセル）" autocomplete="off" aria-label="よくある質問をさがす"></div>
      <div class="stchips" role="group" aria-label="カテゴリ">${['すべて',...ST_FC].map(c=>`<button class="chip ${F.cat===c?'on':''}" data-act="stfc:${c}" aria-pressed="${F.cat===c}">${c}</button>`).join('')}</div>
      <div class="listhd"><b>よくある質問</b><span id="stfcnt">${n}件</span></div>
      ${groups}
      <div class="empty stnone" id="stfnone" ${n?'hidden':''}>${ic('help')}<b>見つかりませんでした</b><small>ことばを変えるか、下の「お問い合わせ」から質問してください</small></div>
      <div class="sechd"><b>解決しないときは</b></div>
      <div class="menu"><button data-go="insurance">${ic('shield')}<span>保険と事故のときの連絡</span>${ic('chev')}</button><button data-go="stcontact">${ic('stmail')}<span>お問い合わせ</span><em>2営業日以内に返信</em>${ic('chev')}</button></div>
      <p class="fine">ケガや事故など急ぎのときは、お問い合わせではなく「緊急報告」を使ってください。</p></div>`};
};

}
