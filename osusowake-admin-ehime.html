<meta charset="utf-8">
<title>おすそわけ収穫 運営管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 運営管理画面：PCは左ナビ＋本文、スマホ幅では上部バー＋開閉メニュー。色はすべてトークン経由 */
:root{
  --g:#13A35A; --g-d:#0C8547; --g-ink:#0A6B38; --g-50:#E7F6ED; --g-100:#CDEEDB; --on-g:#FFFFFF;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#13201A; --ink-2:#4B5C53; --ink-3:#7A8A81; --line:#E1E9E4; --line-2:#CBD8D0; --sunk:#F7FAF8;
  --warm:#E4572A; --warm-50:#FDEDE6; --amber:#C98500; --amber-50:#FFF4DA; --danger:#D23B3B; --danger-50:#FCE9E9; --on-danger:#FFFFFF;
  --info:#2F6FD6; --info-50:#E8F0FC;
  --flash:#FFF1C9; --scrim:rgba(10,24,16,.42); --tip-bg:#13201A; --tip-ink:#FFFFFF;
  --wall-1:#2E5B45; --wall-2:#14281D; --wall-ink:#FFFFFF; --push-bg:rgba(255,255,255,.86); --push-ink:#13201A; --push-sub:#4B5C53;
  --emb-hi:rgba(255,255,255,.24);
  --rk0:#7CC784; --rk0b:#3E8E47; --rk1:#D9A066; --rk1b:#9B6230; --rk2:#C3CCD2; --rk2b:#7D8A93; --rk3:#F4CE55; --rk3b:#B8891A;
  --rk4:#A6E3E0; --rk4b:#4C9FA0; --rk5:#B49BEE; --rk5b:#6545C2; --rk6:#25352D; --rk6b:#E8C35A;
  --shadow:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.07);
  --shadow-lg:0 18px 48px -12px rgba(16,40,28,.32);
  --f-round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g:#2BBF6C; --g-d:#23A65D; --g-ink:#7FE0A7; --g-50:#11281B; --g-100:#1A3C29; --on-g:#04200F;
  --bg:#0C120F; --card:#151E19; --ink:#E5EEE9; --ink-2:#A6B5AD; --ink-3:#7C8C83; --line:#24302A; --line-2:#33423A; --sunk:#101813;
  --warm:#FF7C52; --warm-50:#3A1C12; --amber:#F5B43A; --amber-50:#33280F; --danger:#FF6B6B; --danger-50:#3A1717; --on-danger:#2A0808;
  --info:#7AA7F5; --info-50:#17243A;
  --flash:#3A3214; --scrim:rgba(0,0,0,.62); --tip-bg:#E5EEE9; --tip-ink:#0C120F;
  --wall-1:#1C3A2B; --wall-2:#070D0A; --wall-ink:#E5EEE9; --push-bg:rgba(32,44,38,.9); --push-ink:#E5EEE9; --push-sub:#A6B5AD;
  --emb-hi:rgba(255,255,255,.16);
  --shadow:0 1px 0 rgba(0,0,0,.4); --shadow-lg:0 18px 48px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --g:#2BBF6C; --g-d:#23A65D; --g-ink:#7FE0A7; --g-50:#11281B; --g-100:#1A3C29; --on-g:#04200F;
  --bg:#0C120F; --card:#151E19; --ink:#E5EEE9; --ink-2:#A6B5AD; --ink-3:#7C8C83; --line:#24302A; --line-2:#33423A; --sunk:#101813;
  --warm:#FF7C52; --warm-50:#3A1C12; --amber:#F5B43A; --amber-50:#33280F; --danger:#FF6B6B; --danger-50:#3A1717; --on-danger:#2A0808;
  --info:#7AA7F5; --info-50:#17243A;
  --flash:#3A3214; --scrim:rgba(0,0,0,.62); --tip-bg:#E5EEE9; --tip-ink:#0C120F;
  --wall-1:#1C3A2B; --wall-2:#070D0A; --wall-ink:#E5EEE9; --push-bg:rgba(32,44,38,.9); --push-ink:#E5EEE9; --push-sub:#A6B5AD;
  --emb-hi:rgba(255,255,255,.16);
  --shadow:0 1px 0 rgba(0,0,0,.4); --shadow-lg:0 18px 48px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
h1,h2,h3{font-family:var(--f-round);margin:0;line-height:1.3}
.ic{width:18px;height:18px;flex:none}
.num,.tn{font-variant-numeric:tabular-nums}
.num{font-family:var(--f-round)}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;align-items:start;max-width:1440px;margin:0 auto;padding-top:20px;padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
.side{position:sticky;top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 40px);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--g);color:var(--on-g);display:grid;place-items:center;flex:none}
.logo .ic{width:24px;height:24px}
.brand b{display:block;font-family:var(--f-round);font-weight:800;font-size:16px;line-height:1.25}
.brand small{display:block;color:var(--ink-3);font-size:11.5px}
.menubtn{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;color:var(--ink-2);font-weight:700;font-size:13.5px;position:relative}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button.on{background:var(--g-50);color:var(--g-ink)}
.nav button .rq{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:500;font-family:var(--f-round)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--warm);color:var(--on-danger);font-size:11px;display:grid;place-items:center;padding:0 6px;font-family:var(--f-round)}
.nav .cnt+.rq{margin-left:6px}
.acct{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:8px}
.acct .who{display:flex;gap:8px;align-items:center}
.acct .who b{font-size:13px;display:block}
.acct .who small{font-size:11.5px;color:var(--ink-3);display:block}
.linkbtn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:6px 4px;border-radius:8px;font-weight:700}
.linkbtn:hover{color:var(--g-ink);background:var(--bg)}
.linkbtn .ic{width:16px;height:16px}
.main{min-width:0}
.view-enter{animation:vin .28s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- page header ---------- */
.phd{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:4px 0 18px}
.phd h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phd p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.rqtag{font-family:var(--f-round);font-size:11px;font-weight:700;color:var(--g-ink);background:var(--g-50);border-radius:6px;padding:1px 7px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card>h2,.chd h2{font-size:16px;font-weight:800}
.chd{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.chd p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:11px;background:var(--g);color:var(--on-g);font-weight:700;font-size:13.5px;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--g-d)}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line-2)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.dline{background:var(--card);color:var(--danger);border:1.5px solid var(--danger)}
.btn.dline:hover{background:var(--danger-50)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn .ic{width:16px;height:16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow.end{justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--bg);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.pill .ic{width:12px;height:12px}
.pill.g{background:var(--g-50);color:var(--g-ink)}
.pill.amber{background:var(--amber-50);color:var(--ink)}
.pill.red{background:var(--danger-50);color:var(--danger)}
.pill.info{background:var(--info-50);color:var(--info)}
.pill.line{background:none;border-color:var(--line-2);color:var(--ink-2)}
.pill.pr{background:var(--ink);color:var(--card);border-radius:5px;padding:0 6px;font-family:var(--f-round);letter-spacing:.06em}
.av{width:34px;height:34px;border-radius:50%;background:var(--g-100);color:var(--g-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-round);font-size:14px;flex:none}
.av.f{border-radius:10px;background:var(--amber-50);color:var(--ink)}
.av.lg{width:52px;height:52px;font-size:20px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button .n{font-family:var(--f-round);color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--ink-3);margin:0}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);font-size:13px}
.hr{height:1px;background:var(--line);margin:14px 0}

/* form */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.fld>span em{font-style:normal;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fld>span em.over{color:var(--danger);font-weight:700}
.inp{width:100%;min-width:0;height:38px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--card);padding:0 11px;font-size:13.5px}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.6}
select.inp{padding-right:8px}
.inp:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px var(--g-50)}
.inp[readonly]{background:var(--sunk)}
.search{position:relative;flex:1;min-width:180px}
.search .ic{position:absolute;left:10px;top:10px;color:var(--ink-3)}
.search .inp{padding-left:34px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select.inp{width:auto;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.cchip{position:relative;display:inline-flex}
.cchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.cchip span{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--card);white-space:nowrap}
.cchip input:checked+span{border-color:var(--g);background:var(--g-50);color:var(--g-ink)}
.cchip input:focus-visible+span{outline:3px solid var(--g);outline-offset:2px}
.cchip input:disabled+span{opacity:.45}
.cchip.bad input:checked+span{border-color:var(--danger);background:var(--danger-50);color:var(--danger)}
.err{color:var(--danger);font-size:12.5px;font-weight:700;margin:0;display:flex;gap:6px;align-items:flex-start}
.err .ic{width:16px;height:16px;margin-top:2px}

/* table */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.t th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t td.r{font-variant-numeric:tabular-nums;font-family:var(--f-round)}
.t .nm{display:flex;align-items:center;gap:9px;min-width:0}
.t .nm b{display:block;font-size:13px}
.t .nm small{display:block;color:var(--ink-3);font-size:11.5px}
.t tbody tr:hover{background:var(--sunk)}
.t.min{min-width:0}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:var(--flash)}100%{background:transparent}}
.dim td{color:var(--ink-3)}

/* ---------- dashboard ---------- */
.todo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.todo button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;min-width:0}
.todo button:hover{border-color:var(--g)}
.todo .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--g-50);color:var(--g-ink);flex:none}
.todo .ti.w{background:var(--warm-50);color:var(--warm)}
.todo .ti.a{background:var(--amber-50);color:var(--amber)}
.todo .ti.i{background:var(--info-50);color:var(--info)}
.todo b{font-family:var(--f-round);font-size:20px;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.todo small{display:block;font-size:12px;color:var(--ink-2);line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .kl{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.kpi .kl small{font-weight:500;color:var(--ink-3)}
.kpi .kv{font-family:var(--f-round);font-weight:800;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .kv small{font-size:14px;font-weight:700;margin-left:2px;color:var(--ink-2)}
.kpi .kd{font-size:12px;display:flex;align-items:center;gap:3px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kpi .kd b{font-weight:700}
.kpi .kd.up b{color:var(--g-ink)} .kpi .kd.dn b{color:var(--danger)}
.kpi .kd .ic{width:14px;height:14px}
.kpi .kd.up .ic{color:var(--g-ink)} .kpi .kd.dn .ic{color:var(--danger)}
.chart{width:100%;min-height:220px;position:relative}
.chart svg{display:block;overflow:visible}
.ax text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.ax line{stroke:var(--line);stroke-width:1}
.ax line.base{stroke:var(--line-2)}
.mk{fill:var(--g)}
.mk.dim{fill:var(--g-100)}
.ln{fill:none;stroke:var(--g);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--g);stroke:var(--card);stroke-width:2}
.vl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-round);font-variant-numeric:tabular-nums}
.lbl{fill:var(--ink-2);font-size:12px;font-family:var(--f-body)}
.hit{fill:transparent;cursor:default}
.hit:hover+.mk,.hcol:hover .mk{fill:var(--g-d)}
.hcol:hover .bgc{fill:var(--sunk)}
.bgc{fill:transparent}
details.tbl{margin-top:8px}
details.tbl summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:700;padding:4px 0}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums;transform:translate(-50%,calc(-100% - 10px))}
.alist{display:flex;flex-direction:column}
.arow{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap;border-radius:8px}
.arow:last-child{border-bottom:0}
.arow .who{flex:1;min-width:150px}
.arow .who b{font-size:13.5px}
.arow .who small{display:block;color:var(--ink-3);font-size:11.5px}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rule{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border:1px dashed var(--line-2);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.rule .ic{color:var(--amber);margin-top:2px;width:16px;height:16px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.log li:last-child{border-bottom:0}
.log time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-family:var(--f-round)}

/* ---------- split (list + detail) ---------- */
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
.lpane{padding:12px}
.lpane .seg{margin:0 0 10px}
.li{display:flex;flex-direction:column;gap:3px;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid transparent;margin-bottom:4px}
.li:hover{background:var(--sunk)}
.li.on{border-color:var(--g);background:var(--g-50)}
.li .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.li b{font-size:13.5px}
.li small{font-size:11.5px;color:var(--ink-3)}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:12px 0}
.dl div{min-width:0}
.dl dt{font-size:11.5px;color:var(--ink-3);font-weight:700}
.dl dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.docs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .dn b{font-size:13px;display:block}
.doc .dn small{font-size:11.5px;color:var(--ink-3)}
.doc .dn small.w{color:var(--danger)}
.ck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:700;cursor:pointer;white-space:nowrap}
.ck input{width:18px;height:18px;accent-color:var(--g);margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 14px 20px;font-size:12.5px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--g)}
.tl li::after{content:"";position:absolute;left:7px;top:17px;bottom:2px;width:1px;background:var(--line-2)}
.tl li:last-child::after{display:none}
.tl li.sys::before{background:var(--line-2)}
.tl time{color:var(--ink-3);font-family:var(--f-round);font-variant-numeric:tabular-nums;margin-right:6px}

function nice(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const fmtV=(v,dec)=>dec?v.toFixed(dec):nf(Math.round(v));
const topPath=(x,y,w,h,r)=>{r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
function weekLab(i){return md(WEEKS[i])}
function weekTip(i){return `${md(WEEKS[i])}〜${md(addD(WEEKS[i],6))}`}
function chartTrend(W){
  const m=METRICS[S.metric],v=m.v,H=W<480?200:240,L=46,Rr=14,T=22,B=28,iw=W-L-Rr,ih=H-T-B,n=v.length,bw=iw/n;
  let lo,hi,step;
  if(m.type==='bar'){step=nice(Math.max(...v)/4);lo=0;hi=Math.ceil(Math.max(...v)/step)*step;}
  else{const mn=Math.min(...v),mx=Math.max(...v);step=nice((mx-mn)/3);lo=Math.floor(mn/step)*step;hi=Math.ceil(mx/step)*step;if(hi===mx)hi+=step;if(lo===mn&&lo>0)lo-=step;}
  const y=val=>T+ih-(val-lo)/(hi-lo)*ih,cx=i=>L+bw*i+bw/2;
  let g='<g class="ax">';
  for(let t=lo;t<=hi+1e-9;t+=step){const yy=y(t);g+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" class="${t===lo?'base':''}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${fmtV(t,m.dec&&step<1?1:0)}${m.u==='%'?'%':''}</text>`}
  const every=bw<30?3:bw<44?2:1;
  for(let i=0;i<n;i++){if((n-1-i)%every)continue;g+=`<text x="${cx(i)}" y="${H-8}" text-anchor="middle">${weekLab(i)}</text>`}
  g+=`<text x="${L-8}" y="${T-10}" text-anchor="end">${m.u==='%'?'':m.u}</text></g>`;
  let marks='';
  if(m.type==='bar'){const w=Math.max(6,Math.min(34,bw*.58));
    for(let i=0;i<n;i++){const x=cx(i)-w/2,yy=y(v[i]);marks+=`<g class="hcol" data-tip="${weekTip(i)}の週：${fmtV(v[i],0)}${m.u}"><rect class="bgc" x="${L+bw*i+1}" y="${T}" width="${bw-2}" height="${ih}" rx="6"/><path class="mk" d="${topPath(x,yy,w,y(lo)-yy,4)}"/></g>`}
    marks+=`<text class="vl" x="${cx(n-1)}" y="${y(v[n-1])-7}" text-anchor="middle">${fmtV(v[n-1],0)}</text>`;
  }else{
    const pts=v.map((val,i)=>`${cx(i).toFixed(1)},${y(val).toFixed(1)}`).join(' ');
    marks+=`<polyline class="ln" points="${pts}"/>`;
    for(let i=0;i<n;i++){marks+=`<g class="hcol" data-tip="${weekTip(i)}の週：${v[i].toFixed(1)}%"><rect class="bgc" x="${L+bw*i+1}" y="${T}" width="${bw-2}" height="${ih}" rx="6"/><circle class="dot" cx="${cx(i)}" cy="${y(v[i])}" r="${i===n-1?5:4}"/></g>`}
    marks+=`<text class="vl" x="${cx(n-1)}" y="${y(v[n-1])-11}" text-anchor="middle">${v[n-1].toFixed(1)}%</text>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.n}の週ごとの推移（直近12週）">${g}${marks}</svg>`;
}
function chartH(W,rows,u){
  const rowH=30,lw=W<420?64:78,vw=64,T=4,H=rows.length*rowH+T+4,max=Math.max(...rows.map(r=>r[1])),iw=W-lw-vw;
  let s=`<g class="ax"><line class="base" x1="${lw}" x2="${lw}" y1="${T}" y2="${H-4}"/></g>`;
  rows.forEach(([lab,val],i)=>{const yy=T+i*rowH,bh=16,w=Math.max(2,val/max*iw);
    s+=`<g class="hcol" data-tip="${lab}：${nf(val)}${u}"><rect class="bgc" x="0" y="${yy}" width="${W}" height="${rowH-2}" rx="6"/><text class="lbl" x="${lw-8}" y="${yy+rowH/2+4}" text-anchor="end">${lab}</text><rect class="mk" x="${lw}" y="${yy+(rowH-bh)/2-1}" width="${w}" height="${bh}" rx="4"/><text class="vl" x="${lw+w+6}" y="${yy+rowH/2+4}">${nf(val)}${u}</text></g>`});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
}

  document.querySelectorAll('[data-chart]').forEach(el=>{
    const W=Math.max(260,Math.floor(el.clientWidth));

/* キャンペーン：期間・エリア・作物を絞って経験値を増やす */
const ovl=(a,b)=>a.some(x=>b.includes(x));
function cpChecks(){const c=S.cp,s=c.start&&fromIso(c.start),e=c.end&&fromIso(c.end),days=s&&e?Math.round((e-s)/864e5)+1:0;
  const v=+c.val,crops=[...c.crops],areas=[...c.areas];
  const dup=s&&e&&CAMPAIGNS.find(x=>!x.stopped&&cpSt(x)[0]!=='終了'&&fromIso(x.start)<=e&&fromIso(x.end)>=s&&ovl(x.areas,areas)&&(!x.crops.length||!crops.length||ovl(x.crops,crops)));
  return [
    {ok:!!c.name.trim()&&len(c.name)<=20,t:!c.name.trim()?'キャンペーン名を入れてください':len(c.name)>20?'キャンペーン名は20文字までです':'キャンペーン名が入っています'},
    {ok:c.type==='mul'?v>1&&v<=3:v>0&&v<=50,t:c.type==='mul'?(v>3?'倍率は3倍までです':`お手伝いでもらえる経験値が${c.val}倍になります`):(v>50?'加算は+50までです':`お手伝い1回ごとに経験値+${c.val}`)},
    {ok:!!(s&&e&&s<=e&&s>=TODAY&&days<=31),t:!(s&&e)?'期間を入れてください':s>e?'終了日が開始日より前です':s<TODAY?'開始日が過ぎています':days>31?`期間は31日までです（いま${days}日）`:`期間 ${md(s)}〜${md(e)}（${days}日間）`},
    {ok:c.areas.size>0,t:c.areas.size?`対象エリア ${c.areas.size===AREAS.length?'全エリア':c.areas.size+'か所'}`:'対象エリアを1つ以上選んでください'},
    {ok:!dup,t:dup?`${dup.id}「${dup.name}」と期間・エリア・作物が重なっています（重ねがけはできません）`:'ほかのキャンペーンと重なっていません'}
  ]}
function vCampaign(){
  const c=S.cp,ch=cpChecks(),allOk=ch.every(x=>x.ok),v=+c.val||0;
  const run=CAMPAIGNS.filter(x=>cpSt(x)[0]==='実施中'),tot=CAMPAIGNS.reduce((a,x)=>[a[0]+x.n,a[1]+x.xp],[0,0]);
  const ex=(h,lbl)=>{const base=Math.floor(h*6),long=h>=3?25:h>=2?10:0,b=base+long,add=c.type==='mul'?Math.round(b*(v-1)):v;return `<li><span>${lbl}</span><b class="tn">${b} → ${b+Math.max(0,add)}</b></li>`};
  return `${phd('キャンペーン','追加','期間・エリア・作物を絞って、お手伝いでもらえる経験値を増やします。対象の募集には参加者アプリで「経験値2倍」などの印が付きます。')}

function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,dec=+el.dataset.dec;if(RM.matches)return;const t0=performance.now(),dur=700;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmtV(to*e,dec);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

  return after>=3&&!restricted(u)?`付与後 ${after}pt。合計3pt以上になるため、30日間（${md(addD(TODAY,30))}まで）の応募停止が始まります。`:`付与後 ${after}pt。${after>=3?'すでに応募停止中です。':`あと${3-after}ptで応募停止になります。`}`}
function penAdd(id){const u=uById(id);const opts=PEN_TYPES.map((t,i)=>[t,i]).filter(([t,i])=>u.k==='f'?i===2:i<2);
  openModal({title:`${u.name} にポイントを付与`,body:`<p>現在 <b class="num">${ptOf(u)}pt</b>${restricted(u)?`・${md(u.until)}まで応募停止中`:''}</p>
    <div class="radios" role="radiogroup">${opts.map(([t,i],k)=>`<label><input type="radio" name="pt" value="${i}" data-pen ${k===0?'checked':''}><span><b>${t[0]}　${t[1]}pt</b><small>${t[2]}</small></span></label>`).join('')}</div>
    <label class="fld"><span>あった日</span><input class="inp" type="date" id="m-date" value="2026-10-30" max="2026-10-30"></label>
    <label class="fld"><span>理由（必須・記録に残ります）</span><textarea class="inp" id="m-reason" style="min-height:60px" placeholder="例：農家さんの申し立てとチェックイン記録で確認"></textarea></label>
    <div class="callout" id="penCalc">${ic('alert')}<span>${penCalcText(u,opts[0][1])}</span></div>`,ok:'付与する',danger:true,
    onChange:()=>{const v=+document.querySelector('input[name=pt]:checked').value;$('#penCalc').innerHTML=`${ic('alert')}<span>${penCalcText(u,v)}</span>`},
    onOk:()=>{const v=+document.querySelector('input[name=pt]:checked').value,r=$('#m-reason').value.trim(),ds=$('#m-date').value;if(!r){mErr('理由を入れてください');return false}if(!ds){mErr('日付を入れてください');return false}
      const t=PEN_TYPES[v];u.pen.push(R(fromIso(ds),t[0],t[1],r,'にしむら'));let extra='';
      if(t[0]==='無断欠席'&&u.k==='p'){const from=u.rank;u.rank=Math.max(0,u.rank-2);extra=`・${RANKS[from]}→${RANKS[u.rank]}`}
      if(ptOf(u)>=3&&!restricted(u)){u.until=addD(TODAY,30);extra+=`・${md(u.until)}まで応募停止`}
      addLog(`${u.name} に${t[0]} ${t[1]}pt を付与${extra}`);S.flash=id;S.penQ='';toast(`${u.name} に ${t[1]}pt を付与しました`);return true}});
}
function penDel(id,rid){const u=uById(id),r=u.pen.find(x=>x.rid===rid);const after=ptOf(u)-r.pt;
  openModal({title:'ポイントを取り消しますか',body:`<p><b>${esc(u.name)}</b>・${md(r.d)} ${r.type} ${r.pt}pt</p><p class="fine">記録時のメモ：${esc(r.note)}</p>
    <label class="fld"><span>取り消す理由（必須）</span><textarea class="inp" id="m-reason" style="min-height:60px" placeholder="例：農家さんの記録ミス。実際は前日に連絡あり"></textarea></label>
    ${restricted(u)&&after<3?`<label class="ck"><input type="checkbox" id="m-lift" checked>合計が${after}ptになるので、応募停止も解除する</label>`:''}
    ${r.type==='無断欠席'?`<p class="fine">下がったランクは自動では戻りません。必要ならシステム担当に依頼してください。</p>`:''}`,ok:'取り消す',danger:true,
    onOk:()=>{const why=$('#m-reason').value.trim();if(!why){mErr('理由を入れてください');return false}u.pen=u.pen.filter(x=>x.rid!==rid);const lift=$('#m-lift');let ex='';if(lift&&lift.checked){u.until=null;ex='・応募停止も解除'}
      addLog(`${u.name} の${r.type} ${r.pt}pt を取り消し${ex}（${why}）`);S.flash=id;toast('ポイントを取り消しました');return true}});
}
function lift(id){const u=uById(id);openModal({title:`${u.name} の応募停止を解除しますか`,body:`<p>${md(u.until)}までの応募停止を解除し、すぐに応募できるようにします。ポイント（現在 ${ptOf(u)}pt）はそのまま残り、90日で失効します。</p><label class="fld"><span>解除する理由（必須）</span><textarea class="inp" id="m-reason" style="min-height:60px" placeholder="例：欠席の理由が急病だったと確認できた"></textarea></label>`,ok:'解除する',

function restrict(id){const u=uById(id);openModal({title:`${u.name} を応募停止にしますか`,body:`<p>きょうから30日間（${md(addD(TODAY,30))}まで）、新しい応募ができなくなります。承認済みの予定はそのまま残ります。</p><label class="fld"><span>理由（必須）</span><textarea class="inp" id="m-reason" style="min-height:60px"></textarea></label>`,ok:'応募停止にする',danger:true,
  onOk:()=>{const r=$('#m-reason').value.trim();if(!r){mErr('理由を入れてください');return false}u.until=addD(TODAY,30);addLog(`${u.name} を手動で応募停止（${r}）`);S.flash=id;toast('応募停止にしました');return true}})}
function tkSave(){const t=tkById(S.tkSel),st=S.tkSt||t.st,note=S.tkNote.trim(),e=$('#tkErr');
  if(!note&&st===t.st){e.innerHTML=`${ic('alert')}<span>状態を変えるか、メモを入れてください</span>`;e.hidden=false;return}
  const parts=[];if(st!==t.st)parts.push(`状態を「${TK_ST[t.st][0]}」→「${TK_ST[st][0]}」に変更`);if(note)parts.push(note);
  t.hist.push({t:stamp(),w:'にしむら',x:parts.join('。')});t.st=st;S.tkNote='';S.tkSt='';addLog(`通報 ${t.id}：${parts[0]}`);S.flash=t.id;
  if(S.tkFilter==='open'&&st!=='open')S.tkFilter='active';if(S.tkFilter==='active'&&st==='done')S.tkFilter='all';
  render();toast('対応を記録しました')}
function ntSend(){const n=S.nt,e=$('#ntErr'),r=reach(),BMAX=n.kind==='app'?400:60;let msg='';
  if(!n.p&&!n.f)msg='対象（参加者・農家）を選んでください';else if(!n.areas.size)msg='エリアを1つ以上選んでください';else if(n.p&&!n.f&&!n.ranks.size)msg='ランクを1つ以上選んでください';
  else if(!n.title.trim())msg='タイトルを入れてください';else if(len(n.title)>20)msg='タイトルは20文字までです';else if(!n.body.trim())msg='本文を入れてください';else if(len(n.body)>BMAX&&n.kind!=='both')msg=`本文は${BMAX}文字までです`;else if(n.kind==='both'&&len(n.body)>400)msg='本文は400文字までです';
  else if(n.when==='sched'&&(!n.at||new Date(n.at)<=new Date(2026,9,30,0,0)))msg='予約日時を正しく入れてください';

  const L=S.login,el=$('#login');

  let body='';

function onField(e){
  const t=e.target;
  if(e.isComposing)return;
  if(t.dataset.f){S[t.dataset.f]=t.value;if(t.dataset.f!=='tkNote'&&t.dataset.f!=='tkSt')render();return}
  if(t.dataset.nt){const k=t.dataset.nt,n=S.nt;
    if(k==='p'||k==='f')n[k]=t.checked;else if(k==='area'){t.checked?n.areas.add(t.value):n.areas.delete(t.value)}else if(k==='rank'){t.checked?n.ranks.add(+t.value):n.ranks.delete(+t.value)}else n[k]=t.value;
    $('#ntErr')&&($('#ntErr').hidden=true);render();return}
  if(t.dataset.cp){const k=t.dataset.cp,c=S.cp;
    if(k==='area'){t.checked?c.areas.add(t.value):c.areas.delete(t.value)}else if(k==='crop'){t.checked?c.crops.add(t.value):c.crops.delete(t.value)}
    else if(k==='type'){c.type=t.value;c.val=t.value==='mul'?'2':'20'}else c[k]=t.value;render();return}
  if(t.dataset.ad){const k=t.dataset.ad,a=S.ad;
    if(k==='area'){t.checked?a.areas.add(t.value):a.areas.delete(t.value)}else if(k==='crop'){t.checked?a.crops.add(t.value):a.crops.delete(t.value)}else a[k]=t.value;render();return}
  if(t.dataset.doc!=null&&e.type==='change'){const a=APPS.find(x=>x.id===S.farmSel),i=+t.dataset.doc;if(t.checked){if(!a.checked.includes(i))a.checked.push(i)}else a.checked=a.checked.filter(x=>x!==i);render();return}
  if(t.hasAttribute('data-pen')&&S.modal&&S.modal.onChange){S.modal.onChange();return}
  if(t.dataset.otp!=null&&S.login){const i=+t.dataset.otp,v=t.value.replace(/\D/g,'');
    if(v.length>1){v.slice(0,6-i).split('').forEach((d,k)=>S.login.code[i+k]=d)}else S.login.code[i]=v;
    S.login.err='';const nx=Math.min(5,i+Math.max(1,v.length));renderLogin();const el=$(`#otp-${v?nx:i}`);if(el){el.focus();el.select()}return}
}

document.addEventListener('change',e=>{const t=e.target;if(t.type==='checkbox'||t.type==='radio'||t.tagName==='SELECT'||t.type==='date'||t.type==='datetime-local')onField(e)});
document.addEventListener('compositionend',e=>{onField({target:e.target,type:'input',isComposing:false})});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.login){closeLogin(false)}else if(S.modal)closeModal();else if(S.drawer)closeDrawer();else $('#side').classList.remove('open')}
  if(e.key==='Backspace'&&e.target.dataset&&e.target.dataset.otp!=null&&!e.target.value&&S.login){const i=+e.target.dataset.otp;if(i>0){S.login.code[i-1]='';renderLogin();$(`#otp-${i-1}`).focus()}}
  if(e.key==='Enter'&&S.login&&e.target.id==='lg-pw'){e.preventDefault();$('[data-act="lgNext"]').click()}
  if(e.key==='Tab'&&(S.modal||S.drawer||S.login)){const root=S.login?$('#login'):S.modal?$('#modal'):$('#drawer');const f=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')];if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});

document.title='おすそわけ収穫 運営管理';
render(true);
</script>
